<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistemas de ecuaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* Una lección por pantallas cortas: lees poco, mueves mucho, y cada respuesta tiene su porqué.
   Ana siempre azul, Luis siempre ámbar, el queso violeta, lo correcto verde, el error rojo.
   Cada nivel tiñe el fondo con su color (--lv). */
:root{color-scheme:light;--bg:#f4f2ff;--ink:#1b1838;--mute:#6a6790;--card:#ffffff;--line:#e2ddf5;--soft:#eeeafc;--paper:#fffdf6;--paperline:#e9e2cf;
 --ana:#1a78c9;--luis:#b87400;--queso:#7a45d6;--ok:#1f9d55;--okd:#167a41;--on-ok:#ffffff;--okbg:#e2f7ea;--bad:#dc4038;--badd:#a92c25;--badbg:#fde8e6;--focus:#5b4fe0;--focusbg:#ece9ff;
 --lv:#ff8a3d;--lv2:#ffc94a;--sh:0 1px 0 rgba(27,24,56,.05),0 12px 28px -14px rgba(58,40,150,.32);--shs:0 6px 18px -10px rgba(58,40,150,.35);
 --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-math:"Crimson Pro",Georgia,"Times New Roman",serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0d22;--ink:#f0eefc;--mute:#a7a3cc;--card:#1b1837;--line:#302b58;--soft:#262248;--paper:#221f42;--paperline:#3a3566;
 --ana:#6cc4ff;--luis:#ffcf4a;--queso:#c7a6ff;--ok:#5fe08f;--okd:#2fa862;--on-ok:#06210f;--okbg:#123222;--bad:#ff7d74;--badd:#c2463e;--badbg:#3a1619;--focus:#a49bff;--focusbg:#272352;
 --sh:0 1px 0 rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);--shs:0 6px 18px -10px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0d22;--ink:#f0eefc;--mute:#a7a3cc;--card:#1b1837;--line:#302b58;--soft:#262248;--paper:#221f42;--paperline:#3a3566;
 --ana:#6cc4ff;--luis:#ffcf4a;--queso:#c7a6ff;--ok:#5fe08f;--okd:#2fa862;--on-ok:#06210f;--okbg:#123222;--bad:#ff7d74;--badd:#c2463e;--badbg:#3a1619;--focus:#a49bff;--focusbg:#272352;
 --sh:0 1px 0 rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);--shs:0 6px 18px -10px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-ui);overflow:hidden;transition:background .6s}
/* fondo vivo: dos manchas de luz del color del nivel que se mueven lento, y una trama de puntos */
#aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}
#aura i{position:absolute;border-radius:50%;width:46vmax;height:46vmax;transition:background 1s}
#aura i:nth-child(1){background:var(--lv);left:-6%;top:-14%;opacity:.42;animation:drift1 22s ease-in-out infinite alternate}
#aura i:nth-child(2){background:var(--lv2);right:-8%;top:8%;opacity:.3;animation:drift2 26s ease-in-out infinite alternate}
#aura i:nth-child(3){background:var(--focus);left:30%;bottom:-24%;opacity:.16;animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vmax,10vmax) scale(.9)}}
#dots{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%);opacity:.8}
button,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,canvas:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
i.v,.mth i{font-family:var(--f-math);font-style:italic;font-size:1.12em}
.t-ana{color:var(--ana)}.t-luis{color:var(--luis)}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-mute{color:var(--mute)}.t-q{color:var(--queso)}
svg.ico{width:1.4em;height:1.4em;vertical-align:-.3em;flex:0 0 auto;overflow:visible}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#hd{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.ib{width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;line-height:1;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;transition:transform .1s}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ib svg{width:20px;height:20px}
#prog{flex:1;display:flex;gap:5px}
#prog .seg{flex:1;height:12px;background:var(--soft);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
#prog .seg i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),#7ee6a5);transition:width .6s cubic-bezier(.3,1.4,.5,1);position:relative}
#prog .seg i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.45)}
.xp{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;color:var(--luis);min-width:58px;justify-content:center}
.xp.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.45) rotate(-6deg)}}
#streak{font-weight:800;font-size:14px;color:#ff6a2a;display:flex;align-items:center;gap:2px;transition:opacity .3s}
#streak.off{opacity:.25;filter:grayscale(1)}
#main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 26px;scrollbar-width:thin}
.top{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px;box-shadow:var(--shs)}
.lvl b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--lv);color:#fff;font-size:11px;letter-spacing:0}
.say{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;display:grid;place-items:center;padding:0}
.say svg{width:17px;height:17px}
#prompt{font-size:clamp(19px,3.7vw,24px);line-height:1.36;font-weight:700;margin:0 0 16px;text-wrap:pretty;letter-spacing:-.01em}
#prompt i.v{font-weight:600}
#vis{display:flex;flex-direction:column;gap:14px}
.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(5){animation-delay:.28s}
#prompt.enter2{animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes okpop{45%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 25%,transparent)}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.shake{animation:shake .42s}
/* pie con la hoja de respuesta y la mascota */
#ft{position:relative;padding:12px 16px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);transition:background .25s}
#ft.ok{background:var(--okbg);border-top-color:transparent}#ft.bad{background:var(--badbg);border-top-color:transparent}
#sheet{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;animation:rise .35s both}
#sheet .mas{width:58px;height:58px;flex:0 0 auto}
#sheet h3{margin:2px 0 2px;font-size:19px;font-weight:800}
#ft.ok #sheet h3{color:var(--ok)}#ft.bad #sheet h3{color:var(--bad)}
#sheet p{margin:0;font-size:15.5px;line-height:1.45}
.b3d,#go{position:relative;width:100%;padding:14px;border-radius:16px;border:0;font:800 17px var(--f-ui);letter-spacing:.02em;background:var(--ok);color:var(--on-ok);cursor:pointer;box-shadow:0 4px 0 var(--okd);transition:transform .08s,box-shadow .08s,background .2s}
.b3d:active,#go:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--okd)}
#go:disabled{background:var(--soft);color:var(--mute);cursor:not-allowed;box-shadow:0 4px 0 var(--line)}
#ft.bad #go{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--badd)}
.hintbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:6px 14px;font:700 14px var(--f-ui);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.hintbox{background:var(--focusbg);border-radius:14px;padding:11px 14px;font-size:15px;border-left:4px solid var(--focus);animation:rise .3s both}
/* mascota: un pancito con cara */
.mas .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mas.happy{animation:hop .6s cubic-bezier(.3,1.6,.5,1) 2}
.mas.sad{animation:shake .5s}
.mas.idle{animation:floaty 3s ease-in-out infinite}
@keyframes hop{40%{transform:translateY(-12px) rotate(-8deg)}}
.mas .m-happy,.mas .m-sad{display:none}.mas.happy .m-happy,.mas.sad .m-sad{display:inline}.mas.happy .m-idle,.mas.sad .m-idle{display:none}
/* opciones con relieve */
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 15px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:650 17px var(--f-ui);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s,border-color .15s,background .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:30px;height:30px;flex:0 0 auto;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mute);transition:all .15s}
.opt .oi{width:40px;height:40px;flex:0 0 auto}
.opt.sel{border-color:var(--focus);background:var(--focusbg);box-shadow:0 4px 0 var(--focus)}.opt.sel .k{border-color:var(--focus);background:var(--focus);color:#fff}
.opt.wrong{border-color:var(--bad);opacity:.5;cursor:not-allowed;box-shadow:0 4px 0 var(--bad);animation:shake .42s}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok);animation:okpop .45s}.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opts.grid2 .opt{flex-direction:column;text-align:center;padding:14px 10px}
.opts.grid2 .opt .k{display:none}
/* huecos */
.eq{font:400 clamp(22px,4.6vw,30px)/1.9 var(--f-math);text-align:center}
.eq .line{display:block}
.eqcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--sh)}
input.blank{width:3.1em;height:1.6em;font:inherit;font-size:1em;text-align:center;border:2px solid var(--line);border-bottom-width:4px;border-radius:11px;background:var(--soft);color:var(--ink);margin:0 3px;vertical-align:middle;transition:border-color .2s,background .2s}
input.blank:focus{border-color:var(--focus);background:var(--card);outline:none}
input.blank.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg);animation:okpop .4s}input.blank.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg);animation:shake .4s}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.xbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;background:var(--card);border-radius:13px;padding:8px 14px;font:800 15px var(--f-ui);cursor:pointer;color:var(--focus);box-shadow:0 3px 0 currentColor;transition:transform .08s,box-shadow .08s}
.xbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 currentColor}
.xbtn.ana{color:var(--ana)}.xbtn.luis{color:var(--luis)}.xbtn.okc{color:var(--ok)}
.xbtn.ghost{border-color:var(--line);color:var(--mute);box-shadow:0 3px 0 var(--line)}
.xbtn:disabled{opacity:.4;cursor:not-allowed}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;background:var(--card);box-shadow:var(--shs)}
.idea{text-align:center;font:italic 600 clamp(28px,6.4vw,42px) var(--f-math);background:linear-gradient(90deg,var(--ok),var(--ana),var(--queso));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:99px;padding:3px 12px;font:700 14px var(--f-ui)}
.chip.ok{color:var(--ok);background:var(--okbg)}.chip.no{color:var(--mute)}.chip.badc{color:var(--bad);background:var(--badbg)}
.found{display:flex;flex-wrap:wrap;gap:8px;min-height:2.4em;justify-content:center}
/* boletas de papel */
.bolrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.bol{position:relative;background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;padding:12px 14px 22px;box-shadow:var(--sh);text-align:center;
 -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x;
 mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 9px repeat-x;transition:transform .25s}
.bol::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--who)}
.bol.ana{--who:var(--ana)}.bol.luis{--who:var(--luis)}.bol.q{--who:var(--queso)}
.bol .hdr{display:flex;align-items:center;justify-content:center;gap:8px;font:800 12px var(--f-ui);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.bol .hdr svg{width:30px;height:30px}
.bol .hdr b{color:var(--who);font-size:15px;letter-spacing:.02em;text-transform:none}
.bol .items{display:flex;justify-content:center;align-items:flex-end;gap:2px;min-height:48px;margin:6px 0 4px;flex-wrap:wrap}
.bol .items svg{width:clamp(24px,5.8vw,40px);height:clamp(24px,5.8vw,40px);animation:pop .45s both}
.bol .rule{border-top:2px dashed var(--paperline);margin:6px 0}
.bol .tot{display:flex;justify-content:space-between;align-items:baseline;font:800 clamp(18px,3.6vw,24px) var(--f-ui)}
.bol .tot small{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.bol .mth{font:400 clamp(18px,4vw,24px) var(--f-math);color:var(--ink);margin:4px 0}
.bol.tap{cursor:pointer}.bol.tap:hover{transform:translateY(-3px) rotate(-.5deg)}
.stamp{position:absolute;right:8px;top:34px;font:900 15px var(--f-ui);letter-spacing:.12em;color:var(--ok);border:3px solid var(--ok);border-radius:8px;padding:2px 8px;transform:rotate(-14deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both;background:color-mix(in srgb,var(--paper) 70%,transparent)}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.4);opacity:0}}
/* medidor de la cuenta: bloques por artículo contra la meta */
.meter{position:relative;height:34px;border-radius:10px;background:var(--soft);margin:12px 0 18px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;display:flex;border-radius:10px;overflow:hidden;transition:width .35s cubic-bezier(.3,1.3,.5,1)}
.meter .blk{height:100%;display:grid;place-items:center;border-right:2px solid var(--paper);transition:width .35s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
.meter .blk svg{width:22px;height:22px}
.meter .blk.pan{background:#f2c27b}.meter .blk.jugo{background:#ffb27a}
.meter .goal{position:absolute;top:-6px;bottom:-6px;width:3px;border-radius:2px;background:var(--ink)}
.meter .goal span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:800 11px var(--f-ui);white-space:nowrap;margin-top:2px}
.meter.over .fill{box-shadow:0 0 0 2px var(--bad)}.meter.hit .fill{box-shadow:0 0 0 3px var(--ok);animation:glow 1.2s 2}
/* perillas de precio */
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.knob{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:4px}
.knob .lab{display:flex;align-items:center;gap:6px;font-weight:800}
.knob .lab svg{width:34px;height:34px}
.knob .val{font:800 30px var(--f-ui);line-height:1;letter-spacing:-.02em}
.knob .row{display:flex;align-items:center;gap:8px;width:100%}
.knob .pm{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:800 20px var(--f-ui);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.knob .pm:active{transform:translateY(2px);box-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--focus) var(--p,0%),var(--soft) var(--p,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--soft)}
input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--focus)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:var(--card);border:4px solid var(--focus);box-shadow:0 3px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--focus)}
.sl{display:grid;grid-template-columns:5.2em 1fr 3.6em;align-items:center;gap:10px;font-weight:700}
.sl output{font-weight:800;text-align:right}
/* plano */
canvas.plane{display:block;width:100%;max-width:520px;aspect-ratio:11/10;margin:0 auto;border:1px solid var(--line);border-radius:20px;background:var(--card);touch-action:none;cursor:grab;box-shadow:var(--sh)}
.plane.s{max-width:390px!important}
.pstat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:700;min-height:2.2em;margin-top:10px}
/* balanza */
.balw{position:relative;width:min(100%,460px);margin:0 auto;height:230px}
.balw .post{position:absolute;left:50%;bottom:14px;width:12px;height:150px;transform:translateX(-50%);border-radius:6px;background:linear-gradient(90deg,#8c7a5c,#c8b48c,#8c7a5c)}
.balw .base{position:absolute;left:50%;bottom:0;width:150px;height:18px;transform:translateX(-50%);border-radius:10px 10px 4px 4px;background:linear-gradient(#c8b48c,#8c7a5c)}
.balw .pivot{position:absolute;left:50%;top:58px;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#e9d9b3;border:4px solid #8c7a5c;z-index:3}
.beam{position:absolute;left:64px;right:64px;top:52px;height:12px;border-radius:6px;background:linear-gradient(#e9d9b3,#a8946c);transition:transform .8s cubic-bezier(.4,1.5,.5,1);z-index:2}
.hang{position:absolute;top:6px;width:0;transition:transform .8s cubic-bezier(.4,1.5,.5,1);transform-origin:0 0}
.hang.l{left:0}.hang.r{left:100%}
.hang .ch{position:absolute;left:-1px;top:0;width:2px;height:46px;background:var(--mute);box-shadow:-30px 0 0 var(--mute),30px 0 0 var(--mute)}
.hang .ch{transform:none}
.dish{position:absolute;top:44px;left:0;transform:translateX(-50%);min-width:110px;max-width:126px;min-height:58px;padding:6px 8px 14px;border-radius:6px 6px 60px 60px;background:linear-gradient(color-mix(in srgb,var(--card) 70%,#c8b48c),#c8b48c);border-top:4px solid #8c7a5c;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:1px;transition:box-shadow .3s}
.dish svg{width:20px;height:20px;animation:pop .35s both}
.dish .lbl{width:100%;text-align:center;font:400 19px var(--f-math);color:#2b2414}
.dish.bad{box-shadow:0 0 0 3px var(--bad)}
.balmsg{text-align:center;min-height:1.6em;font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* sustitución */
.eqline{font:400 clamp(26px,5.6vw,38px) var(--f-math);text-align:center;line-height:1.8}
button.slot{font:inherit;color:var(--focus);border:2px dashed var(--focus);background:var(--focusbg);border-radius:12px;padding:0 10px;cursor:pointer;animation:pulse 1.4s infinite}
button.slot.hot{background:var(--focus);color:#fff;transform:scale(1.15)}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent;background:transparent}}
.tile{display:inline-block;border:2px solid var(--luis);color:var(--luis);background:var(--card);border-radius:12px;padding:0 12px;font:400 clamp(22px,4.6vw,30px) var(--f-math);box-shadow:0 4px 0 var(--luis)}
.tile.drag{cursor:grab;touch-action:none;user-select:none}
.tile.drag.dragging{cursor:grabbing;box-shadow:0 14px 30px -6px rgba(0,0,0,.35);z-index:20;position:relative}
.newpart{color:var(--luis);display:inline-block;animation:pop .6s both}
/* fichas para armar ecuaciones */
.build{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.build.full{border-style:solid;border-color:var(--focus)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ftile{min-width:52px;height:50px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:400 26px var(--f-math);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s,opacity .2s}
.ftile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ftile.used{opacity:.2;pointer-events:none}
.build .ftile{animation:pop .3s both;border-color:var(--focus);box-shadow:0 4px 0 var(--focus)}
/* bandeja para cambiar panes por jugos */
.tray{display:flex;justify-content:center;gap:6px;padding:14px 12px;border-radius:22px;background:linear-gradient(#d9b98a,#b8926a);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),var(--sh)}
.tray button{border:0;background:rgba(255,255,255,.18);border-radius:14px;padding:4px;cursor:pointer;transition:transform .3s}
.tray button svg{width:clamp(40px,10vw,56px);height:clamp(40px,10vw,56px);display:block}
.tray button.pan:hover{transform:translateY(-4px)}
.tray button.flip{animation:flip .5s}
@keyframes flip{50%{transform:rotateY(90deg) scale(.8)}}
.tot-big{display:flex;justify-content:center;align-items:center;gap:12px;font:800 clamp(26px,6vw,36px) var(--f-ui)}
.tot-big .arrow{color:var(--mute);font-size:.7em}
/* tarjetas que se voltean */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:900px}
.fc{position:relative;height:150px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.fc.on{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;box-shadow:var(--sh);color:var(--ink)}
.fc .f{background:var(--card);border:2px solid var(--line);font:800 17px var(--f-ui)}
.fc .f svg{width:64px;height:64px}
.fc .b{background:var(--focusbg);border:2px solid var(--focus);transform:rotateY(180deg);font:600 15px/1.35 var(--f-ui);text-align:center}
.fc .b b{color:var(--focus)}
/* sistemas alineados */
.sys{display:flex;align-items:center;justify-content:center;gap:6px}
.brace{font:300 clamp(54px,10vw,90px)/1 var(--f-math);transform:scaleX(.75)}
.eqs{display:flex;flex-direction:column}
.g5{display:grid;grid-template-columns:1em 2.5em 1em 2.7em 1.2em 2.2em;justify-items:end;align-items:center;font:400 clamp(22px,4.6vw,32px)/1.4 var(--f-math)}
.g5 span{padding:0 1px}
.sys.sm .g5{font-size:clamp(19px,3.6vw,26px)}.sys.sm .brace{font-size:clamp(44px,7vw,66px)}
.term{font:inherit;color:inherit;border:2px solid transparent;background:none;border-radius:10px;padding:0 4px;cursor:pointer;transition:all .15s}
.term:hover{border-color:var(--line);background:var(--soft)}
.term.sel{border-color:var(--focus);background:var(--focusbg)}
.term.right{border-color:var(--ok);background:var(--okbg);animation:okpop .4s}
.term.wrong{border-color:var(--bad);opacity:.5;animation:shake .4s}
.glowt{border-radius:8px;animation:tglow 1.4s ease-in-out infinite;padding:0 3px}
@keyframes tglow{50%{background:color-mix(in srgb,var(--ok) 28%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}}
.strike{position:relative;transition:opacity .5s .5s,transform .5s .5s}
.strike::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:3px;border-radius:2px;background:var(--bad);transform:scaleX(0);transform-origin:left;transition:transform .45s}
.strike.go::after{transform:scaleX(1)}.strike.go{opacity:.25}
/* resta animada de ecuaciones */
.sub{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.sub .r{display:grid;grid-template-columns:1.2em 3.2em 1.2em 3.4em 1.4em 2.6em;justify-items:end;align-items:center;font:400 clamp(21px,4.4vw,30px)/1.5 var(--f-math);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.sub .bar{width:min(100%,330px);height:3px;background:var(--ink);border-radius:2px;transform:scaleX(0);transition:transform .5s .4s}
.sub.go .bar{transform:scaleX(1)}
.sub .res{opacity:0;transition:opacity .4s .9s}.sub.go .res{opacity:1}
/* juegos y 3D */
canvas.gl3{display:block;width:100%;height:min(52vh,400px);border:1px solid var(--line);border-radius:20px;background:var(--card);touch-action:none;cursor:grab;box-shadow:var(--sh)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:15px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shs)}
.timer{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--luis),var(--ok));background-size:300% 100%;background-position:100% 0;border-radius:99px}
.cards{display:flex;flex-direction:column;gap:8px}
.tc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:8px 12px;cursor:pointer;color:var(--ink);font:400 clamp(20px,4.4vw,26px) var(--f-math);box-shadow:0 3px 0 var(--line);transition:transform .12s}
.tc:hover{transform:translateY(-2px)}
.tc.sel1{border-color:var(--ana);background:var(--focusbg);box-shadow:0 3px 0 var(--ana)}.tc.sel2{border-color:var(--luis);background:var(--focusbg);box-shadow:0 3px 0 var(--luis)}
.tc.new{animation:pop .45s both}
.tc .bd{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:800 13px var(--f-ui);background:var(--mute);color:var(--bg)}
.tc .bd.ana{background:var(--ana)}.tc .bd.luis{background:var(--luis)}.tc .bd.q{background:var(--queso)}
.tc small{margin-left:auto;font:700 12px var(--f-ui);color:var(--mute);text-align:right}
.ops{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mulbox{display:inline-flex;gap:6px;align-items:center}
.mulbox input{width:4em;height:38px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;font:700 16px var(--f-ui)}
/* escena de la panadería */
.scene{position:relative;width:100%;max-width:560px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:linear-gradient(#ffe9c7,#ffd7a1)}
.scene svg{display:block;width:100%;height:auto}
.scene .who{transform-box:fill-box;transform-origin:bottom center}
.scene .walkL{animation:walkL 1.4s cubic-bezier(.3,1.2,.5,1) both}
.scene .walkR{animation:walkR 1.4s .3s cubic-bezier(.3,1.2,.5,1) both}
@keyframes walkL{from{transform:translateX(-140px)}}
@keyframes walkR{from{transform:translateX(160px)}}
.scene .bob{animation:floaty 2.4s ease-in-out infinite}
.scene .steam{animation:steam 3s ease-in-out infinite;opacity:.6}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.6}100%{transform:translateY(-16px);opacity:0}}
.printed{animation:print .9s cubic-bezier(.3,1.2,.5,1) both;transform-origin:top}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-10px)}to{clip-path:inset(0 0 -20px 0)}}
/* lupa */
canvas.zoom{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:50%;border:6px solid var(--ink);background:var(--card);box-shadow:var(--sh)}
/* billetes */
.bills{display:flex;gap:14px;justify-content:center;align-items:center;min-height:120px}
.bill{border:0;padding:0;background:none;cursor:pointer}
.bill svg{width:clamp(150px,40vw,210px);height:auto;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.bill.half svg{width:clamp(110px,30vw,150px)}
.bill.tear{animation:tear .5s both}
@keyframes tear{to{transform:scale(.6) rotate(8deg);opacity:0}}
/* ayuda de los retos */
.helpbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--mute)}
.steps .st{padding:6px 0;border-top:1px dashed var(--line);font:400 19px/1.5 var(--f-math);animation:rise .4s both}
canvas.mini{display:block;width:min(100%,300px);aspect-ratio:1;margin:8px auto 0;border:1px solid var(--line);border-radius:16px;background:var(--card)}
canvas.mini[hidden]{display:none}

#menuP{position:fixed;inset:0;z-index:30;background:rgba(10,8,30,.5);display:flex;justify-content:flex-start;backdrop-filter:blur(3px)}

@keyframes slidein{from{transform:translateX(-100%)}}
#menuP h2{margin:0 0 12px;font-size:19px}
#menuP button.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:10px;font:700 15px var(--f-ui);cursor:pointer;box-shadow:0 3px 0 var(--line)}
#menuP button.lv .n{width:36px;height:36px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
#menuP button.lv small{display:block;color:var(--mute);font-weight:500}
#start{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 16px;overflow:hidden}
#start .hero{position:relative;width:min(92vw,420px);aspect-ratio:1.35}
#start .hero svg{width:100%;height:100%;overflow:visible}
#start h1{position:relative;margin:0;font:italic 600 clamp(36px,8.4vw,58px)/1.05 var(--f-math);text-wrap:balance}
#start h1 span{background:linear-gradient(90deg,var(--ana),var(--queso),var(--luis));-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{position:relative;margin:0;color:var(--mute);max-width:430px;font-size:16.5px}
#start .btns{position:relative;display:flex;flex-direction:column;gap:12px;width:min(100%,330px);margin-top:6px}
#start button.alt{background:var(--card);color:var(--ok);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s .4s cubic-bezier(.5,0,.3,1) forwards}
.draw.d2{animation-delay:1s}
@keyframes draw{to{stroke-dashoffset:0}}
.orb{transform-box:fill-box;transform-origin:center;animation:floaty 3.2s ease-in-out infinite}
.orb.o2{animation-duration:3.8s;animation-delay:-1s}.orb.o3{animation-duration:4.4s;animation-delay:-2s}.orb.o4{animation-duration:3.5s;animation-delay:-.5s}
.cross{transform-box:fill-box;transform-origin:center;animation:pop .5s 2.4s both}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}.frac>span:last-child{padding:0 .25em}
#lvlup{position:fixed;inset:0;z-index:45;background:rgba(10,8,30,.6);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
#lvlup .box{position:relative;background:var(--card);border-radius:28px;padding:24px 22px 22px;text-align:center;width:min(100%,390px);animation:pop .5s both;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
#lvlup .medal{width:150px;height:150px;margin:-80px auto 4px;display:block;overflow:visible}
#lvlup .rays{transform-origin:75px 75px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lvlup h2{margin:0 0 4px;font:italic 600 32px var(--f-math)}#lvlup p{margin:0 0 14px;color:var(--mute)}
#lvlup .stats{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
#lvlup .stats div{flex:1;border:2px solid var(--line);border-radius:16px;padding:8px 6px;font:800 22px var(--f-ui)}
#lvlup .stats small{display:block;font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.flyxp{position:fixed;z-index:61;pointer-events:none;font:900 20px var(--f-ui);color:var(--luis);animation:flyxp 1s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes flyxp{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.recap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap .m{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-weight:600;font-size:14px;animation:pop .5s both}
.recap .m svg{width:52px;height:52px}
.recap .m b{font-size:16px}
@media (max-width:520px){.knobs{grid-template-columns:1fr;gap:8px}.knob{flex-direction:row;padding:8px 10px;gap:8px}.knob .row{flex:1}.knob .val{font-size:22px;min-width:2.3em;text-align:right;order:3}.knob .lab{min-width:4.2em}.knob .lab svg{width:28px;height:28px}}
.hot{outline:3px dashed var(--focus);outline-offset:4px}
@media (min-width:900px){#app{max-width:820px}#prompt{font-size:25px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
const $=id=>document.getElementById(id);
const V=t=>t.replace(/\{(\w)\}/g,'<i class="v">$1</i>');
const fmt=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?''+r:(''+r).replace('.',',')};
const numS=c=>c<0?'−'+(-c):''+c;
const css=()=>{const s=getComputedStyle(document.documentElement);return k=>s.getPropertyValue('--'+k).trim()};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== voz (opcional) ===== */
const SS=window.speechSynthesis;let voice=null,SND=true;
function pickVoice(){if(!SS)return;const v=SS.getVoices().filter(v=>/^es/i.test(v.lang));
 voice=v.find(v=>/es-(MX|US|419)/i.test(v.lang)&&/google|natural|neural/i.test(v.name))||v.find(v=>/natural|neural|google/i.test(v.name))||v.find(v=>/es-(MX|US|419)/i.test(v.lang))||v[0]||null}
if(SS){pickVoice();SS.onvoiceschanged=pickVoice}
const spoken=t=>t.replace(/<[^>]+>/g,' ').replace(/\[\[[^\]]*\]\]/g,' espacio ').replace(/\{x\}/g,' equis ').replace(/\{y\}/g,' ye ').replace(/\{(\w)\}/g,' $1 ')
 .replace(/\(([−-]?\d+), ([−-]?\d+)\)/g,'$1 coma $2').replace(/(\d)\.(\d)/g,'$1 coma $2')
 .replace(/×/g,' por ').replace(/ · /g,' por ').replace(/·/g,' por ').replace(/−/g,' menos ').replace(/\+/g,' más ')
 .replace(/÷|\//g,' entre ').replace(/ = /g,' igual a ').replace(/=/g,' igual a ').replace(/\$(\d+)/g,'$1 dólares');
let sayTimer=0;
function say(t){clearTimeout(sayTimer);if(!SS)return;SS.cancel();if(!SND||!voice)return;
 sayTimer=setTimeout(()=>{const u=new SpeechSynthesisUtterance(spoken(t));u.voice=voice;u.lang=voice.lang;u.rate=.98;u.pitch=.95;SS.speak(u)},80)}

/*EX-START*/
/* ===== generador de retos y pasos resueltos ===== */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const nz=()=>{let v=0;while(!v)v=rnd(-5,5);return v};
const parS=n=>n<0?`(−${-n})`:`${n}`;
const cof=k=>k===1?'':k===-1?'−':numS(k);
function lin(p,q,w){let s='';if(p!==0)s+=numS(p);if(q!==0){const a=Math.abs(q),t=(a===1?'':a)+`{${w}}`;s+=s===''?(q<0?'−':'')+t:(q<0?' − ':' + ')+t}return s||'0'}
function eqS(a,b,c){return `${cof(a)}{x} ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}{y} = ${numS(c)}`}
function genSys(level){
 for(let t=0;t<800;t++){
  const x0=rnd(-5,6),y0=rnd(-5,6);let c=[nz(),nz(),nz(),nz()];
  if(level===0)c=[1,1,1,-1];
  else if(level===1||level===2){c[rnd(0,3)]=Math.random()<.5?1:-1}
  else if(level===3&&x0>=0&&y0>=0)continue;
  const [a1,b1,a2,b2]=c;if(a1*b2-a2*b1===0)continue;
  if(level===1&&Math.abs(a1)===Math.abs(a2)&&Math.abs(b1)===Math.abs(b2))continue;
  return {a1,b1,c1:a1*x0+b1*y0,a2,b2,c2:a2*x0+b2*y0,x0,y0}}}
function stRed(s){const {a1,b1,c1,a2,b2,c2}=s,L=[];
 const l=a1*a2/gcd(a1,a2),m1=Math.abs(l/a1),m2=Math.abs(l/a2),sub_=Math.sign(a1)===Math.sign(a2);
 L.push(m1===1&&m2===1?'Las {x} ya tienen el mismo número, así que no hace falta multiplicar.':`Quiero que la {x} quede con el mismo número en las dos. Multiplico ${m1===1?'solo ② por '+m2:m2===1?'solo ① por '+m1:'① por '+m1+' y ② por '+m2}.`);
 if(m1!==1)L.push(`① × ${m1}:  ${eqS(a1*m1,b1*m1,c1*m1)}`);
 if(m2!==1)L.push(`② × ${m2}:  ${eqS(a2*m2,b2*m2,c2*m2)}`);
 const B=sub_?b1*m1-b2*m2:b1*m1+b2*m2,C=sub_?c1*m1-c2*m2:c1*m1+c2*m2,y=C/B;
 L.push(`${sub_?'Resto':'Sumo'} las dos ecuaciones y las {x} se van:  ${cof(B)}{y} = ${numS(C)}`);
 L.push(`{y} = ${numS(C)} ÷ ${parS(B)} = ${numS(y)}`);
 const r=c1-b1*y,x=r/a1;
 L.push(`Vuelvo a ①:  ${cof(a1)}{x} + ${parS(b1)}·${parS(y)} = ${numS(c1)}  →  ${cof(a1)}{x} = ${numS(r)}`);
 L.push(`{x} = ${numS(x)}`);return {L,x,y}}
function isol(s){const E=[[s.a1,s.b1,s.c1],[s.a2,s.b2,s.c2]];let best=null;
 for(let i=0;i<2;i++)for(let v=0;v<2;v++){const k=Math.abs(E[i][v]);if(!best||k<best.k)best={i,v,k}}return {E,...best}}
function stSus(s){const {E,i,v}=isol(s),j=1-i,N=['x','y'],vn=N[v],wn=N[1-v],O='①②';
 const [al,be,ga]=[E[i][v],E[i][1-v],E[i][2]],sg=al<0?-1:1,d=Math.abs(al),n0=sg*ga,n1=-sg*be,inner=lin(n0,n1,wn);
 const cv=E[j][v],cw=E[j][1-v],cj=E[j][2],L=[];
 const wrap=d===1?`(${inner})`:`(${inner})/${d}`;
 L.push(`Despejo {${vn}} en ${O[i]}:  {${vn}} = ${d===1?inner:`(${inner})/${d}`}`);
 const cvp=cv===1?wrap:cv===-1?'−'+wrap:numS(cv)+wrap;
 const tw=(k)=>`${k<0?'−':'+'} ${Math.abs(k)===1?'':Math.abs(k)}{${wn}}`;
 L.push(`Sustituyo en ${O[j]}:  ${cvp} ${tw(cw)} = ${numS(cj)}`);
 const cvi=cv===1?`(${inner})`:cv===-1?`−(${inner})`:`${numS(cv)}(${inner})`;
 if(d!==1)L.push(`Multiplico todo por ${d} para quitar el denominador:  ${cvi} ${tw(cw*d)} = ${numS(cj*d)}`);
 const K=cv*n1+d*cw,R=d*cj-cv*n0,w=R/K;
 L.push(`Reparto y junto términos:  ${cof(K)}{${wn}} = ${numS(R)}`);
 L.push(`{${wn}} = ${numS(R)} ÷ ${parS(K)} = ${numS(w)}`);
 const val=(n0+n1*w)/d;
 L.push(`Vuelvo a la receta:  {${vn}} = ${d===1?'':'('}${numS(n0)} ${n1<0?'−':'+'} ${Math.abs(n1)}·${parS(w)}${d===1?'':')/'+d} = ${numS(val)}`);
 return {L,x:v===0?val:w,y:v===0?w:val}}
function stIg(s){const {a1,b1,c1,a2,b2,c2}=s,L=[];
 const sg1=a1<0?-1:1,d=Math.abs(a1),n0=sg1*c1,n1=-sg1*b1,sg2=a2<0?-1:1,e=Math.abs(a2),m0=sg2*c2,m1=-sg2*b2;
 const ex=(p,q,k)=>k===1?lin(p,q,'y'):`(${lin(p,q,'y')})/${k}`;
 L.push(`Despejo {x} en ①:  {x} = ${ex(n0,n1,d)}`);
 L.push(`Despejo {x} en ②:  {x} = ${ex(m0,m1,e)}`);
 L.push(`Igualo las dos recetas:  ${ex(n0,n1,d)} = ${ex(m0,m1,e)}`);
 const K=e*n1-d*m1,R=d*m0-e*n0,y=R/K;
 if(d!==1||e!==1){const w=(k,p,q)=>k===1?`(${lin(p,q,'y')})`:`${k}(${lin(p,q,'y')})`;L.push(`Multiplico en cruz para quitar denominadores:  ${w(e,n0,n1)} = ${w(d,m0,m1)}`)}
 L.push(`Junto las {y} a un lado y los números al otro:  ${cof(K)}{y} = ${numS(R)}`);
 L.push(`{y} = ${numS(R)} ÷ ${parS(K)} = ${numS(y)}`);
 const x=(n0+n1*y)/d;
 L.push(`Vuelvo a una receta:  {x} = ${d===1?'':'('}${numS(n0)} ${n1<0?'−':'+'} ${Math.abs(n1)}·${parS(y)}${d===1?'':')/'+d} = ${numS(x)}`);
 return {L,x,y}}
/*EX-END*/

/* ===== piezas de pantalla ===== */
const tm=(k,v)=>{const a=Math.abs(k);return (k<0?'−':'')+(a===1?'':a)+`<i class="v">${v}</i>`};
const g5=(a,b,c,cls='')=>`<div class="g5 ${cls}"><span></span><span>${a==null?'':tm(a,'x')}</span><span>${a==null||b==null?'':(b<0?'−':'+')}</span><span>${b==null?'':tm(a==null?b:Math.abs(b),'y')}</span><span>=</span><span>${numS(c)}</span></div>`;
const SYS=(A,B,sm='')=>`<div class="sys ${sm}"><span class="brace">{</span><div class="eqs">${g5(A[0],A[1],A[2],'t-ana')}${g5(B[0],B[1],B[2],'t-luis')}</div></div>`;
const EA=[3,2,12],EB=[1,4,14];
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const SYSC=SYS(EA,EB,'sm');
const parseNum=s=>{s=(s||'').trim().replace('−','-').replace(',','.');if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/');return +a/+b}return s===''?NaN:+s};

/* huecos [[respuesta]] dentro de una ecuación */
function blanksHTML(eq){return V(eq).replace(/\[\[([^\]]+)\]\]/g,'<input class="blank" inputmode="decimal" autocomplete="off" data-a="$1" aria-label="espacio en blanco">')}
function wireBlanks(scope,api,why,badMsg){
 const ins=[...scope.querySelectorAll('input.blank')];
 const upd=()=>api.enable(ins.every(i=>i.value.trim()!==''));
 ins.forEach(i=>i.addEventListener('input',()=>{i.classList.remove('ok','bad');upd()}));
 ins.forEach((i,k)=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();k<ins.length-1?ins[k+1].focus():$('go').click()}}));
 api.setCheck(()=>{let good=0;ins.forEach(i=>{const ok=Math.abs(parseNum(i.value)-parseNum(i.dataset.a))<1e-9;i.classList.toggle('ok',ok);i.classList.toggle('bad',!ok);good+=ok});
  return good===ins.length?{ok:true,msg:why}:{ok:false,msg:badMsg||(good?'Una va bien. Revisa la roja.':'Todavía no. Mira la pista si la necesitas.')}});
 if(ins[0])setTimeout(()=>ins[0].focus({preventScroll:true}),50);upd()}

/* ===== plano de precios (pan en horizontal, jugo en vertical) ===== */
function endsIn(a,b,c,x0,x1,y0,y1){const P=[],ok=(x,y)=>!P.some(p=>Math.abs(p[0]-x)<1e-9&&Math.abs(p[1]-y)<1e-9);
 if(b!==0)for(const x of[x0,x1]){const y=(c-a*x)/b;if(y>=y0-1e-9&&y<=y1+1e-9&&ok(x,y))P.push([x,y])}
 if(a!==0)for(const y of[y0,y1]){const x=(c-b*y)/a;if(x>=x0-1e-9&&x<=x1+1e-9&&ok(x,y))P.push([x,y])}
 return P.length>1?P.slice(0,2):null}
function plane(el,api,cfg){
 const wrap=document.createElement('div');
 wrap.innerHTML=`<canvas class="plane ${cfg.small?'s':''}" ${cfg.noPoint?'':'tabindex="0"'} aria-label="Plano de precios. Pan en el eje horizontal, jugo en el vertical.${cfg.noPoint?'':' Usa las flechas para mover el punto.'}"></canvas><div class="pstat" aria-live="polite"></div>`;
 el.appendChild(wrap);
 const cv=wrap.querySelector('canvas'),ps=wrap.querySelector('.pstat');
 const X0=0,X1=10,Y0=0,Y1=9,mL=36,mB=30,mT=12,mR=16;
 const ctx={lines:cfg.lines||[],pt:cfg.noPoint?null:(cfg.start||[1,1]),trace:[],cv,mark:cfg.mark||[],bad:[]};
 const sat=(eq,p)=>Math.abs(eq[0]*p[0]+eq[1]*p[1]-eq[2])<1e-9;ctx.sat=sat;
 function draw(){
  const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

/* ===== tarjetas de boleta: operaciones puras ===== */
const gcdA=a=>a.reduce((g,v)=>gcd(g,Math.abs(v)),0);
const cMul=(c,n)=>({co:c.co.map(v=>v*n),k:c.k*n});
const cAdd=(a,b,s)=>({co:a.co.map((v,i)=>v+s*b.co[i]),k:a.k+s*b.k});
const cGcd=c=>gcdA([...c.co,c.k]);
const cDiv=(c,n)=>({co:c.co.map(v=>v/n),k:c.k/n});
function cTxt(c,nm){const parts=[];c.co.forEach((v,i)=>{if(v===0)return;const a=Math.abs(v),t=(a===1?'':a)+`{${nm[i]}}`;parts.push(parts.length?(v<0?' − ':' + ')+t:(v<0?'−':'')+t)});return (parts.join('')||'0')+' = '+(c.k<0?'−'+(-c.k):c.k)}
function solvedOf(cards,n){const out=Array(n).fill(null);cards.forEach(c=>{const nz=c.co.map((v,i)=>v!==0?i:-1).filter(i=>i>=0);if(nz.length===1&&c.co[nz[0]]===1)out[nz[0]]=c.k});return out}
function hintFor(cards,n,nm){
 for(const c of cards){const nz=c.co.filter(v=>v!==0);if(nz.length===1&&nz[0]!==1)return `La tarjeta ${c.id} ya tiene una sola incógnita, pero con un número delante. Divídela para dejarla sola.`}
 const sol=solvedOf(cards,n);
 for(let i=0;i<n;i++){if(sol[i]!==null)continue;for(let a=0;a<cards.length;a++)for(let b=a+1;b<cards.length;b++){const x=cards[a].co[i],y=cards[b].co[i];
  if(x!==0&&Math.abs(x)===Math.abs(y)&&(cards[a].co.filter(v=>v).length>1||cards[b].co.filter(v=>v).length>1)){const r=Math.sign(x)===Math.sign(y);return `En las tarjetas ${cards[a].id} y ${cards[b].id} la {${nm[i]}} tiene el mismo número${r?'':' con signo opuesto'}. Prueba ${r?'restarlas':'sumarlas'}: esa incógnita desaparece.`}}}
 let best=null;for(let i=0;i<n;i++){if(sol[i]!==null)continue;const idx=cards.map((c,k)=>c.co[i]!==0?k:-1).filter(k=>k>=0);if(idx.length>=2)best=best||[i,idx[0],idx[1]]}
 if(best){const [i,a,b]=best;return `Quieres que la {${nm[i]}} tenga el mismo número en las tarjetas ${cards[a].id} y ${cards[b].id}. Multiplica cada una por el número de la otra y luego combínalas.`}
 return 'Mira qué incógnitas ya conoces y combina tarjetas para encontrar las que faltan.'}

/* arrastrar una pieza hasta un destino; tocarla sin moverla también cuenta (y Enter con teclado) */
function dragTo(src,tgt,onDrop){
 let sx=0,sy=0,on=false,moved=false;src.classList.add('drag');src.tabIndex=0;src.setAttribute('role','button');
 const inT=e=>{const r=tgt.getBoundingClientRect();return e.clientX>r.left-10&&e.clientX<r.right+10&&e.clientY>r.top-10&&e.clientY<r.bottom+10};
 src.addEventListener('pointerdown',e=>{on=true;moved=false;sx=e.clientX;sy=e.clientY;src.setPointerCapture(e.pointerId);src.classList.add('dragging')});
 src.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;src.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-8,Math.min(8,dx/30))}deg)`;tgt.classList.toggle('hot',inT(e))});
 src.addEventListener('click',()=>{if(moved){moved=false;return}onDrop(src.getBoundingClientRect())});
 src.addEventListener('pointerup',e=>{if(!on)return;on=false;src.classList.remove('dragging');const hit=inT(e)||!moved;tgt.classList.remove('hot');
  const from=src.getBoundingClientRect();if(!hit&&!reduce)src.animate([{transform:src.style.transform},{transform:'none'}],{duration:380,easing:'cubic-bezier(.3,1.4,.5,1)'});src.style.transform='';if(hit)onDrop(from)});
 src.addEventListener('pointercancel',()=>{on=false;src.style.transform='';src.classList.remove('dragging');tgt.classList.remove('hot')});
 src.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onDrop(src.getBoundingClientRect())}})}
/* animación FLIP: el elemento nuevo aparece volando desde donde estaba la pieza */
function flyFrom(el,from){if(reduce||!el)return;const to=el.getBoundingClientRect();el.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(.9)`,opacity:.6},{transform:'none',opacity:1}],{duration:520,easing:'cubic-bezier(.3,1.3,.5,1)'})}

function zoomLens(el){

 el.appendChild(box);const cv=box.querySelector('canvas'),P=[2.37,3.81],G=[2.4,3.8];
 const draw=()=>{if(!cv.isConnected||!$('zz'))return;const z=Math.pow(60,$('zz').value/100);$('zo').textContent='×'+Math.round(z);$('zz').style.setProperty('--p',$('zz').value+'%');
  const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth;if(!W)return;cv.width=cv.height=Math.round(W*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const c=css();
  const half=5/z,cx=G[0],cy=G[1],X=x=>W/2+(x-cx)/half*W/2,Y=y=>W/2-(y-cy)/half*W/2;
  const st=Math.pow(10,Math.floor(Math.log10(half/2)));g.font='11px Figtree,sans-serif';g.fillStyle=c('mute');g.lineWidth=1;
  for(let v=Math.ceil((cx-half)/st)*st;v<=cx+half;v+=st){g.strokeStyle=c('line');g.beginPath();g.moveTo(X(v),0);g.lineTo(X(v),W);g.stroke();g.fillText(+v.toFixed(3),X(v)+2,W-8)}
  for(let v=Math.ceil((cy-half)/st)*st;v<=cy+half;v+=st){g.strokeStyle=c('line');g.beginPath();g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();g.fillText(+v.toFixed(3),6,Y(v)-3)}
  [[.6,'ana'],[-1.5,'luis']].forEach(([m,k])=>{g.strokeStyle=c(k);g.lineWidth=Math.max(3,Math.min(10,2.5*Math.sqrt(1)));g.lineCap='round';g.beginPath();g.moveTo(X(cx-half),Y(P[1]+m*(cx-half-P[0])));g.lineTo(X(cx+half),Y(P[1]+m*(cx+half-P[0])));g.stroke()});
  g.strokeStyle=c('ink');g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.arc(X(G[0]),Y(G[1]),9,0,7);g.stroke();g.setLineDash([]);

 fill('ig2','(12 − 2y)/3 = 14 − 4y. Multiplica los dos lados por 3.','12 − 2{y} = [[42]] − [[12]]{y}','El 14 también se triplica: 42. Y el 4y se vuelve 12y.',{hint:'Multiplica cada término del lado derecho por 3.'}),

 fill('red1','Resta la ecuación de abajo de la de arriba. Pulsa el botón y completa lo que queda.','[[10]]{y} = [[30]]','12y − 2y = 10y y 42 − 12 = 30. Cuidado: al restar, el signo cambia en toda la ecuación de abajo.',{hint:'12 − 2 y 42 − 12.',pre:el=>subAnim(el)}),

 explore('game-mesa2','Juego: la mesa de boletas. Cada boleta es una tarjeta. Multiplícalas, súmalas o réstalas hasta tener una tarjeta por incógnita. Tú eliges el camino y gana quien use menos movimientos.',(el,api)=>{const s=genPos();mesa(el,api,{n:2,nm:['x','y'],par:8,sol:[s.x0,s.y0],init:[{co:[s.a1,s.b1],k:s.c1,src:'ana'},{co:[s.a2,s.b2],k:s.c2,src:'luis'}]})},{game:true}),
 read('callback','¿Recuerdas la bandeja, cuando cambiaste panes por jugos y dedujiste que el jugo cuesta $1 más que el pan? Eso ya era una reducción: restaste una boleta de otra. Lo descubriste antes de que te lo enseñara.',

/* ===== motor de la lección ===== */
const flat=[];LV.forEach((lv,li)=>lv.steps.forEach((st,si)=>flat.push({li,si,st})));
let gi=0,S=null,SEL=null,STREAK=0,BEST=0,ACC=0;
try{XP=+localStorage.getItem('sel-xp')||0}catch(e){}$('xp').querySelector('b').textContent=XP;
const store={get(){try{return +localStorage.getItem('sel-prog')||0}catch(e){return 0}},set(v){try{localStorage.setItem('sel-prog',v)}catch(e){}}};
function buildProg(){$('prog').innerHTML=LV.map(()=>'<div class="seg"><i></i></div>').join('')}
function updProg(){const e=flat[gi];[...$('prog').children].forEach((s,i)=>{const n=LV[i].steps.length;s.firstChild.style.width=(i<e.li?100:i===e.li?(e.si/n*100):0)+'%'});$('prog').setAttribute('aria-valuenow',Math.round(gi/flat.length*100))}
function setBtn(label,enabled){const b=$('go');b.textContent=label;b.disabled=!enabled}
function setStreak(){const e=$('streak');e.querySelector('b').textContent=STREAK;e.classList.toggle('off',STREAK<2);if(STREAK>=2){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}
function show(i){
 runCleanups();$('lvlup').hidden=true;gi=i;store.set(i);const e=flat[i],st=e.st;SEL=null;window.__auto=null;
 S={phase:'ask',en:false,check:null,onRetry:null,markRight:null,fails:0};
 const R=document.documentElement.style;R.setProperty('--lv',LVC[e.li][0]);R.setProperty('--lv2',LVC[e.li][1]);
 $('ft').className='';$('sheet').hidden=true;$('lvl').innerHTML=`<b>${e.li+1}</b>${LV[e.li].title.split(' · ')[1]}`;
 const pr=$('prompt');pr.innerHTML=V(st.text);pr.classList.remove('enter2');void pr.offsetWidth;pr.classList.add('enter2');
 const vis=$('vis');vis.innerHTML='';vis.dataset.sid=st.id;vis.dataset.kind=st.k;
 vis.className='';void vis.offsetWidth;vis.className='enter';
 const api={enable:v=>{S.en=v;if(S.phase==='ask'&&S.check)setBtn('Comprobar',v)},setCheck:f=>{S.check=f},cleanup:f=>cleanups.push(f),
  onRetry:f=>{S.onRetry=f},onRight:f=>{S.markRight=f},auto:f=>{window.__auto=f},
  done:msg=>{if(S.phase!=='ask')return;succeed(msg||st.ok||st.why||'¡Muy bien!')}};
 if(st.vis)vis.insertAdjacentHTML('beforeend',st.vis);
 if(st.k==='read'){if(st.mount)st.mount(vis);S.phase='ok';setBtn(st.last?'Terminar':'Continuar',true)}
 else if(st.k==='choice'){if(st.mount)st.mount(vis);mountChoice(st,vis,api)}
 else if(st.k==='fill'){if(st.pre)st.pre(vis);const d=document.createElement('div');d.className='eq eqcard';d.innerHTML=blanksHTML(st.eq);vis.appendChild(d);if(st.mount)st.mount(vis,{});wireBlanks(vis,api,st.why);setBtn('Comprobar',false)}
 else if(st.k==='explore'){setBtn('Continuar',false);st.mount(vis,api)}
 else if(st.k==='check'){setBtn('Comprobar',false);st.mount(vis,api)}
 if(st.hint)addHint(vis,st.hint);
 updProg();$('main').scrollTop=0;say(st.text)}
function addHint(vis,txt){const b=document.createElement('button');b.className='hintbtn';b.innerHTML=ic('bulb')+'¿Una pista?';const box=document.createElement('div');box.className='hintbox';box.hidden=true;box.innerHTML=V(txt);
 b.onclick=()=>{box.hidden=!box.hidden;if(!box.hidden)say(txt)};vis.appendChild(b);vis.appendChild(box)}
function mountChoice(st,vis,api){
 const idx=st.opts.map((_,i)=>i);if(!st.keep)for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 const box=document.createElement('div');box.className='opts';
 idx.forEach((oi,n)=>{const b=document.createElement('button');b.className='opt';b.dataset.i=oi;b.innerHTML=`<span class="k">${'ABCD'[n]}</span><span>${V(st.opts[oi])}</span>`;
  b.onclick=()=>{if(S.phase!=='ask'||b.classList.contains('wrong'))return;sfx.pop();box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');SEL=oi;api.enable(true)};box.appendChild(b)});
 vis.appendChild(box);
 api.setCheck(()=>SEL===st.ans?{ok:true,msg:st.why}:{ok:false,msg:st.hints[SEL]||'Casi. Piénsalo otra vez.'});
 S.onRetry=()=>{const b=box.querySelector(`.opt[data-i="${SEL}"]`);if(b){b.classList.remove('sel');b.classList.add('wrong')}SEL=null;api.enable(false)};
 S.markRight=()=>{const b=box.querySelector(`.opt[data-i="${SEL}"]`);if(b){b.classList.remove('sel');b.classList.add('right')}};
 setBtn('Comprobar',false)}
function sheet(kind,title,msg){const s=$('sheet');s.hidden=false;s.innerHTML=`${MAS(kind==='ok'?'happy':'sad')}<div><h3>${title}</h3><p>${V(msg)}</p></div>`;$('ft').className=kind}
const GOOD=['¡Eso es!','¡Muy bien!','Exacto.','Así se hace.','¡Bien visto!','¡Clavado!'];
function flyXP(n){if(reduce)return;const r=$('go').getBoundingClientRect(),d=document.createElement('div');d.className='flyxp';d.textContent='+'+n;d.style.left=(r.left+r.width/2-16)+'px';d.style.top=(r.top-10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function succeed(msg){S.phase='ok';const st=flat[gi].st,k=st.k;
 if(k==='choice'||k==='fill'||k==='check'){const n=S.fails?5:10;addXP(n);flyXP(n);ACC++;if(!S.fails){STREAK++;BEST=Math.max(BEST,STREAK)}setStreak()}
 else if(k==='explore'&&!st.game){addXP(10);flyXP(10)}
 if(!st.game)sfx.ok();if(S.markRight)S.markRight();
 let t=GOOD[Math.floor(Math.random()*GOOD.length)];if(STREAK>=3&&!S.fails&&k!=='explore')t=`¡${STREAK} seguidas!`;
 sheet('ok',t,msg);setBtn(st.last?'Terminar':'Continuar',true);say(msg);
 document.querySelectorAll('#vis input.blank').forEach(i=>i.disabled=true)}
function fail(msg){S.phase='bad';S.fails=(S.fails||0)+1;STREAK=0;setStreak();sfx.bad();sheet('bad','Todavía no',msg);setBtn('Intentar de nuevo',true);say(msg)}
function retry(){S.phase='ask';$('ft').className='';$('sheet').hidden=true;if(S.onRetry)S.onRetry();setBtn('Comprobar',S.en&&S.check?S.en:false);if(S.en)$('go').disabled=false;const f=document.querySelector('#vis input.blank.bad');if(f)f.focus()}
$('go').onclick=()=>{
 const st=flat[gi].st;
 if(S.phase==='ok'){if(st.last){SS&&SS.cancel();$('start').hidden=false;store.set(0);$('goC').hidden=true;return}next();return}
 if(S.phase==='bad'){retry();return}
 if(S.check){const r=S.check();r.ok?succeed(r.msg):fail(r.msg)}};
function next(){if(gi>=flat.length-1)return;const a=flat[gi],b=flat[gi+1];if(a.li!==b.li)interlude(a.li,b.li);else show(gi+1)}
{const g=document.querySelector('#lvlup .rays');g.innerHTML=Array.from({length:12},(_,i)=>`<path d="M75 75L${75+80*Math.cos(i*Math.PI/6-.12)} ${75+80*Math.sin(i*Math.PI/6-.12)}L${75+80*Math.cos(i*Math.PI/6+.12)} ${75+80*Math.sin(i*Math.PI/6+.12)}z" fill="#ffd34d" opacity=".35"/>`).join('')}
function interlude(a,b){confetti();sfx.win();const o=$('lvlup');$('medn').textContent=a+1;o.querySelector('h2').textContent=`¡Nivel ${a+1} completado!`;
 o.querySelector('p').textContent=`Lo que viene: ${LV[b].title.split(' · ')[1]}.`;$('stx').textContent=XP;$('sta').textContent=ACC;$('sts').textContent=BEST;
 o.hidden=false;$('lvbtn').focus();say(`Nivel completado. Lo que viene: ${LV[b].title.split(' · ')[1]}.`)}
$('lvbtn').onclick=()=>{$('lvlup').hidden=true;show(gi+1)};
$('say').onclick=()=>say(flat[gi].st.text);
$('snd').onclick=()=>{SND=!SND;$('snd').innerHTML=`<svg><use href="#i-${SND?'snd':'mute'}"/></svg>`;if(!SND&&SS)SS.cancel()};
$('menu').onclick=()=>{$('menuP').hidden=false};
$('menuP').onclick=e=>{if(e.target===$('menuP'))$('menuP').hidden=true};
function buildMenu(){let k=0;$('menuL').innerHTML='';LV.forEach((lv,li)=>{const start=k;k+=lv.steps.length;const b=document.createElement('button');b.className='lv';
 b.innerHTML=`<span class="n" style="background:${LVC[li][0]}">${li+1}</span><span>${lv.title.split(' · ')[1]}<small>${lv.steps.length} pantallas</small></span>`;b.onclick=()=>{$('menuP').hidden=true;show(start)};$('menuL').appendChild(b)})}
addEventListener('keydown',e=>{if(e.key==='Escape')$('menuP').hidden=true});
function begin(i){if(SS){const u=new SpeechSynthesisUtterance(' ');SS.speak(u)}$('start').hidden=true;buildProg();buildMenu();show(i)}
$('go0').onclick=()=>begin(0);
$('goC').onclick=()=>begin(Math.min(store.get(),flat.length-1));
{const p=store.get();if(p>0&&p<flat.length-1)$('goC').hidden=false}
const qs=new URLSearchParams(location.search);if(qs.get('step'))begin(+qs.get('step'));
</script>
