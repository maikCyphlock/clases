<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistemas de ecuaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* Una lección por pantallas cortas: lees poco, mueves mucho, y cada respuesta tiene su porqué.
   Ana siempre azul, Luis siempre ámbar, lo correcto verde, el error rojo. */
:root{color-scheme:light;--bg:#f5f7fb;--ink:#14182b;--mute:#5a627e;--card:#ffffff;--line:#d9dfee;--soft:#e9edf6;
 --ana:#0e76a3;--luis:#a56a00;--ok:#1c9a50;--on-ok:#ffffff;--okbg:#e3f6ea;--bad:#cf433b;--badbg:#fde9e7;--focus:#5558d9;--focusbg:#ecebfd;
 --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-math:"Crimson Pro",Georgia,"Times New Roman",serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1120;--ink:#eef0f8;--mute:#a0a8c6;--card:#171b31;--line:#2b3252;--soft:#222845;
 --ana:#58c4dd;--luis:#f7e463;--ok:#5fd38a;--on-ok:#08210f;--okbg:#12301f;--bad:#ff7168;--badbg:#38181a;--focus:#9a9cff;--focusbg:#23264d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1120;--ink:#eef0f8;--mute:#a0a8c6;--card:#171b31;--line:#2b3252;--soft:#222845;
 --ana:#58c4dd;--luis:#f7e463;--ok:#5fd38a;--on-ok:#08210f;--okbg:#12301f;--bad:#ff7168;--badbg:#38181a;--focus:#9a9cff;--focusbg:#23264d}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-ui);overflow:hidden}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
i.v,.mth i{font-family:var(--f-math);font-style:italic;font-size:1.12em}
.t-ana{color:var(--ana)}.t-luis{color:var(--luis)}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-mute{color:var(--mute)}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
#hd{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.ib{width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
#prog{flex:1;display:flex;gap:4px}
#prog .seg{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
#prog .seg i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
#main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 22px}
.lvl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 0 8px}
#prompt{font-size:clamp(19px,3.6vw,23px);line-height:1.38;font-weight:600;margin:0 0 14px;text-wrap:pretty}
.say{border:0;background:transparent;color:var(--mute);font:600 13px var(--f-ui);cursor:pointer;padding:2px 0;margin:-6px 0 10px}
#vis{display:flex;flex-direction:column;gap:12px}
.enter{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#ft{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--card);transition:background .25s}
#ft.ok{background:var(--okbg)}#ft.bad{background:var(--badbg)}
#sheet{margin-bottom:10px}
#sheet h3{margin:0 0 2px;font-size:18px}
#ft.ok #sheet h3{color:var(--ok)}#ft.bad #sheet h3{color:var(--bad)}
#sheet p{margin:0;font-size:15.5px;line-height:1.45}
#go{width:100%;padding:14px;border-radius:14px;border:0;font:700 17px var(--f-ui);background:var(--ok);color:var(--on-ok);cursor:pointer}
#go:disabled{background:var(--soft);color:var(--mute);cursor:not-allowed}
#ft.bad #go{background:var(--bad);color:#fff}
.hintbtn{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:5px 14px;font:600 14px var(--f-ui);cursor:pointer}
.hintbox{background:var(--focusbg);border-radius:12px;padding:10px 14px;font-size:15px}
/* opciones */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 15px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 17px var(--f-ui);cursor:pointer}
.opt .k{width:28px;height:28px;flex:0 0 auto;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.opt.sel{border-color:var(--focus);background:var(--focusbg)}.opt.sel .k{border-color:var(--focus);color:var(--focus)}
.opt.wrong{border-color:var(--bad);opacity:.55;cursor:not-allowed}
.opt.right{border-color:var(--ok);background:var(--okbg)}
/* huecos */
.eq{font:400 clamp(22px,4.6vw,30px)/1.9 var(--f-math);text-align:center}
.eq .line{display:block}
input.blank{width:3.1em;height:1.55em;font:inherit;font-size:1em;text-align:center;border:2px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin:0 3px;vertical-align:middle}
input.blank.ok{border-color:var(--ok);color:var(--ok)}input.blank.bad{border-color:var(--bad);color:var(--bad)}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.bolrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bolx{background:var(--card);border:2px solid currentColor;border-radius:14px;padding:12px 14px;text-align:center}
.bolx .who{font-weight:700;font-size:14px}
.bolx .items{font-size:clamp(20px,4.6vw,32px);letter-spacing:0;white-space:nowrap;min-height:1.4em;color:var(--ink)}
.bolx .tot{font-size:clamp(18px,3.4vw,24px);font-weight:700}
.bolx .mth{font:400 clamp(17px,4vw,26px) var(--f-math);color:var(--ink)}
.bolx.ana{color:var(--ana)}.bolx.luis{color:var(--luis)}
.bolx .badge{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;border-radius:99px;padding:2px 12px}
.badge.good{background:var(--okbg);color:var(--ok)}.badge.off{background:var(--soft);color:var(--mute)}
.xbtn{border:2px solid currentColor;background:transparent;border-radius:12px;padding:8px 14px;font:700 15px var(--f-ui);cursor:pointer;color:var(--focus)}
.xbtn.ana{color:var(--ana)}.xbtn.luis{color:var(--luis)}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;background:var(--card)}
.idea{text-align:center;font:italic 600 clamp(26px,6vw,38px) var(--f-math);color:var(--ok)}
/* deslizadores */
.sl{display:grid;grid-template-columns:5.2em 1fr 3.6em;align-items:center;gap:10px;font-weight:600}
.sl input[type=range]{width:100%;accent-color:var(--focus);height:28px}
.sl output{font-weight:700;text-align:right}
.found{display:flex;flex-wrap:wrap;gap:8px;min-height:2.2em}
.chip{border:1px solid currentColor;border-radius:99px;padding:3px 12px;font:600 15px var(--f-ui)}
.chip.ok{color:var(--ok);background:var(--okbg)}.chip.no{color:var(--mute)}
/* plano */
canvas.plane{display:block;width:100%;max-width:500px;aspect-ratio:11/10;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--card);touch-action:none;cursor:grab}
.plane.s{max-width:380px!important}
.pstat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:600;min-height:2.2em;margin-top:8px}
/* balanza */
.bal{position:relative;width:min(100%,440px);height:170px;margin:0 auto}
.beam{position:absolute;left:54px;right:54px;top:40px;height:6px;border-radius:3px;background:var(--ink);transition:transform .6s cubic-bezier(.5,0,.3,1)}
.pan{position:absolute;top:6px;transform:translateX(-50%);transform-origin:50% 0;min-width:92px;text-align:center;padding:8px 12px 12px;border:2px solid currentColor;border-top-width:0;border-radius:0 0 44px 44px;
 font:400 clamp(18px,3.6vw,26px) var(--f-math);white-space:nowrap;transition:transform .6s cubic-bezier(.5,0,.3,1),color .3s;color:var(--ink)}
.pan.l{left:0}.pan.r{left:100%}
.stand{position:absolute;left:50%;top:44px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:96px solid var(--line);transform:translateX(-50%);z-index:-1}
.balmsg{text-align:center;min-height:1.6em;font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* sustitución */
.eqline{font:400 clamp(26px,5.6vw,38px) var(--f-math);text-align:center;line-height:1.8}
button.slot{font:inherit;color:var(--focus);border:2px dashed var(--focus);background:var(--focusbg);border-radius:10px;padding:0 10px;cursor:pointer;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent;background:transparent}}
.tile{display:inline-block;border:2px solid var(--luis);color:var(--luis);border-radius:10px;padding:0 10px;font:400 clamp(22px,4.6vw,30px) var(--f-math)}
.newpart{color:var(--luis);animation:in .5s both}
.bill{font:700 clamp(30px,8vw,48px) var(--f-ui);border:2px solid var(--ok);background:var(--okbg);color:var(--ink);border-radius:14px;padding:14px 24px;cursor:pointer}
.bills{display:flex;gap:12px;justify-content:center;align-items:center;min-height:90px}
/* sistemas alineados */
.sys{display:flex;align-items:center;justify-content:center;gap:6px}
.brace{font:300 clamp(54px,10vw,90px)/1 var(--f-math);transform:scaleX(.75)}
.eqs{display:flex;flex-direction:column}
.g5{display:grid;grid-template-columns:1em 2.5em 1em 2.7em 1.2em 2.2em;justify-items:end;align-items:center;font:400 clamp(22px,4.6vw,32px)/1.4 var(--f-math)}
.g5 span{padding:0 1px}
.sys.sm .g5{font-size:clamp(19px,3.6vw,26px)}.sys.sm .brace{font-size:clamp(44px,7vw,66px)}
/* ayuda de los retos */
.helpbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--mute)}
.steps .st{padding:4px 0;border-top:1px dashed var(--line);font:400 19px/1.5 var(--f-math)}
canvas.mini{display:block;width:min(100%,300px);aspect-ratio:1;margin:8px auto 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
canvas.mini[hidden]{display:none}
/* menú e inicio */
#menuP{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;justify-content:flex-start}
#menuP[hidden]{display:none}
#menuP .panel{width:min(86vw,340px);height:100%;background:var(--card);padding:18px 16px;overflow-y:auto;border-right:1px solid var(--line)}
#menuP h2{margin:0 0 10px;font-size:18px}
#menuP button.lv{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:600 15px var(--f-ui);cursor:pointer}
#menuP button.lv small{display:block;color:var(--mute);font-weight:500}
#start{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 16px}
#start h1{margin:0;font:italic 600 clamp(34px,8vw,54px)/1.1 var(--f-math);text-wrap:balance}
#start p{margin:0;color:var(--mute);max-width:420px}
#start .btns{display:flex;flex-direction:column;gap:10px;width:min(100%,320px)}
#start button{padding:14px;border-radius:14px;border:2px solid var(--ok);font:700 17px var(--f-ui);cursor:pointer;background:var(--ok);color:var(--on-ok)}
#start button.alt{background:transparent;color:var(--ok)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <header id="hd"><button class="ib" id="menu" aria-label="Ver niveles">☰</button><div id="prog" role="progressbar" aria-label="Progreso de la lección"></div><button class="ib" id="snd" aria-label="Activar o silenciar la voz">🔊</button></header>
 <main id="main"><div class="lvl" id="lvl"></div><p id="prompt"></p><button class="say" id="say">Escuchar otra vez</button><div id="vis"></div></main>
 <footer id="ft"><div id="sheet" hidden></div><button id="go">Continuar</button></footer>
</div>
<div id="menuP" hidden><div class="panel"><h2>Niveles</h2><div id="menuL"></div></div></div>
<div id="start"><h1>Sistemas de ecuaciones</h1><p>Aprendes haciendo. Mueves, pruebas, te equivocas un poco y descubres por qué funciona. Son cinco niveles y unos 25 minutos, con narrador opcional.</p><div class="btns"><button id="go0">Comenzar</button><button class="alt" id="goC" hidden>Seguir donde lo dejé</button></div></div>

<script>
const $=id=>document.getElementById(id);
const V=t=>t.replace(/\{(\w)\}/g,'<i class="v">$1</i>');
const fmt=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?''+r:(''+r).replace('.',',')};
const numS=c=>c<0?'−'+(-c):''+c;
const css=()=>{const s=getComputedStyle(document.documentElement);return k=>s.getPropertyValue('--'+k).trim()};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== voz (opcional) ===== */
const SS=window.speechSynthesis;let voice=null,SND=true;
function pickVoice(){if(!SS)return;const v=SS.getVoices().filter(v=>/^es/i.test(v.lang));
 voice=v.find(v=>/es-(MX|US|419)/i.test(v.lang)&&/google|natural|neural/i.test(v.name))||v.find(v=>/natural|neural|google/i.test(v.name))||v.find(v=>/es-(MX|US|419)/i.test(v.lang))||v[0]||null}
if(SS){pickVoice();SS.onvoiceschanged=pickVoice}
const spoken=t=>t.replace(/<[^>]+>/g,' ').replace(/\[\[[^\]]*\]\]/g,' espacio ').replace(/\{x\}/g,' equis ').replace(/\{y\}/g,' ye ').replace(/\{(\w)\}/g,' $1 ')
 .replace(/\(([−-]?\d+), ([−-]?\d+)\)/g,'$1 coma $2').replace(/(\d)\.(\d)/g,'$1 coma $2')
 .replace(/×/g,' por ').replace(/ · /g,' por ').replace(/·/g,' por ').replace(/−/g,' menos ').replace(/\+/g,' más ')
 .replace(/÷|\//g,' entre ').replace(/ = /g,' igual a ').replace(/=/g,' igual a ').replace(/\$(\d+)/g,'$1 dólares');
let sayTimer=0;
function say(t){clearTimeout(sayTimer);if(!SS)return;SS.cancel();if(!SND||!voice)return;
 sayTimer=setTimeout(()=>{const u=new SpeechSynthesisUtterance(spoken(t));u.voice=voice;u.lang=voice.lang;u.rate=.98;u.pitch=.95;SS.speak(u)},80)}

/*EX-START*/
/* ===== generador de retos y pasos resueltos ===== */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const nz=()=>{let v=0;while(!v)v=rnd(-5,5);return v};
const parS=n=>n<0?`(−${-n})`:`${n}`;
const cof=k=>k===1?'':k===-1?'−':numS(k);
function lin(p,q,w){let s='';if(p!==0)s+=numS(p);if(q!==0){const a=Math.abs(q),t=(a===1?'':a)+`{${w}}`;s+=s===''?(q<0?'−':'')+t:(q<0?' − ':' + ')+t}return s||'0'}
function eqS(a,b,c){return `${cof(a)}{x} ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}{y} = ${numS(c)}`}
function genSys(level){
 for(let t=0;t<800;t++){
  const x0=rnd(-5,6),y0=rnd(-5,6);let c=[nz(),nz(),nz(),nz()];
  if(level===0)c=[1,1,1,-1];
  else if(level===1||level===2){c[rnd(0,3)]=Math.random()<.5?1:-1}
  else if(level===3&&x0>=0&&y0>=0)continue;
  const [a1,b1,a2,b2]=c;if(a1*b2-a2*b1===0)continue;
  if(level===1&&Math.abs(a1)===Math.abs(a2)&&Math.abs(b1)===Math.abs(b2))continue;
  return {a1,b1,c1:a1*x0+b1*y0,a2,b2,c2:a2*x0+b2*y0,x0,y0}}}
function stRed(s){const {a1,b1,c1,a2,b2,c2}=s,L=[];
 const l=a1*a2/gcd(a1,a2),m1=Math.abs(l/a1),m2=Math.abs(l/a2),sub_=Math.sign(a1)===Math.sign(a2);
 L.push(m1===1&&m2===1?'Las {x} ya tienen el mismo número, así que no hace falta multiplicar.':`Quiero que la {x} quede con el mismo número en las dos. Multiplico ${m1===1?'solo ② por '+m2:m2===1?'solo ① por '+m1:'① por '+m1+' y ② por '+m2}.`);
 if(m1!==1)L.push(`① × ${m1}:  ${eqS(a1*m1,b1*m1,c1*m1)}`);
 if(m2!==1)L.push(`② × ${m2}:  ${eqS(a2*m2,b2*m2,c2*m2)}`);
 const B=sub_?b1*m1-b2*m2:b1*m1+b2*m2,C=sub_?c1*m1-c2*m2:c1*m1+c2*m2,y=C/B;
 L.push(`${sub_?'Resto':'Sumo'} las dos ecuaciones y las {x} se van:  ${cof(B)}{y} = ${numS(C)}`);
 L.push(`{y} = ${numS(C)} ÷ ${parS(B)} = ${numS(y)}`);
 const r=c1-b1*y,x=r/a1;
 L.push(`Vuelvo a ①:  ${cof(a1)}{x} + ${parS(b1)}·${parS(y)} = ${numS(c1)}  →  ${cof(a1)}{x} = ${numS(r)}`);
 L.push(`{x} = ${numS(x)}`);return {L,x,y}}
function isol(s){const E=[[s.a1,s.b1,s.c1],[s.a2,s.b2,s.c2]];let best=null;
 for(let i=0;i<2;i++)for(let v=0;v<2;v++){const k=Math.abs(E[i][v]);if(!best||k<best.k)best={i,v,k}}return {E,...best}}
function stSus(s){const {E,i,v}=isol(s),j=1-i,N=['x','y'],vn=N[v],wn=N[1-v],O='①②';
 const [al,be,ga]=[E[i][v],E[i][1-v],E[i][2]],sg=al<0?-1:1,d=Math.abs(al),n0=sg*ga,n1=-sg*be,inner=lin(n0,n1,wn);
 const cv=E[j][v],cw=E[j][1-v],cj=E[j][2],L=[];
 const wrap=d===1?`(${inner})`:`(${inner})/${d}`;
 L.push(`Despejo {${vn}} en ${O[i]}:  {${vn}} = ${d===1?inner:`(${inner})/${d}`}`);
 const cvp=cv===1?wrap:cv===-1?'−'+wrap:numS(cv)+wrap;
 const tw=(k)=>`${k<0?'−':'+'} ${Math.abs(k)===1?'':Math.abs(k)}{${wn}}`;
 L.push(`Sustituyo en ${O[j]}:  ${cvp} ${tw(cw)} = ${numS(cj)}`);
 const cvi=cv===1?`(${inner})`:cv===-1?`−(${inner})`:`${numS(cv)}(${inner})`;
 if(d!==1)L.push(`Multiplico todo por ${d} para quitar el denominador:  ${cvi} ${tw(cw*d)} = ${numS(cj*d)}`);
 const K=cv*n1+d*cw,R=d*cj-cv*n0,w=R/K;
 L.push(`Reparto y junto términos:  ${cof(K)}{${wn}} = ${numS(R)}`);
 L.push(`{${wn}} = ${numS(R)} ÷ ${parS(K)} = ${numS(w)}`);
 const val=(n0+n1*w)/d;
 L.push(`Vuelvo a la receta:  {${vn}} = ${d===1?'':'('}${numS(n0)} ${n1<0?'−':'+'} ${Math.abs(n1)}·${parS(w)}${d===1?'':')/'+d} = ${numS(val)}`);
 return {L,x:v===0?val:w,y:v===0?w:val}}
function stIg(s){const {a1,b1,c1,a2,b2,c2}=s,L=[];
 const sg1=a1<0?-1:1,d=Math.abs(a1),n0=sg1*c1,n1=-sg1*b1,sg2=a2<0?-1:1,e=Math.abs(a2),m0=sg2*c2,m1=-sg2*b2;
 const ex=(p,q,k)=>k===1?lin(p,q,'y'):`(${lin(p,q,'y')})/${k}`;
 L.push(`Despejo {x} en ①:  {x} = ${ex(n0,n1,d)}`);
 L.push(`Despejo {x} en ②:  {x} = ${ex(m0,m1,e)}`);
 L.push(`Igualo las dos recetas:  ${ex(n0,n1,d)} = ${ex(m0,m1,e)}`);
 const K=e*n1-d*m1,R=d*m0-e*n0,y=R/K;
 if(d!==1||e!==1){const w=(k,p,q)=>k===1?`(${lin(p,q,'y')})`:`${k}(${lin(p,q,'y')})`;L.push(`Multiplico en cruz para quitar denominadores:  ${w(e,n0,n1)} = ${w(d,m0,m1)}`)}

function endsIn(a,b,c,x0,x1,y0,y1){const P=[],ok=(x,y)=>!P.some(p=>Math.abs(p[0]-x)<1e-9&&Math.abs(p[1]-y)<1e-9);
 if(b!==0)for(const x of[x0,x1]){const y=(c-a*x)/b;if(y>=y0-1e-9&&y<=y1+1e-9&&ok(x,y))P.push([x,y])}
 if(a!==0)for(const y of[y0,y1]){const x=(c-b*y)/a;if(x>=x0-1e-9&&x<=x1+1e-9&&ok(x,y))P.push([x,y])}

  const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(!W)return;

  const c=css(),pw=W-mL-mR,ph=H-mB-mT,X=x=>mL+(x-X0)/(X1-X0)*pw,Y=y=>H-mB-(y-Y0)/(Y1-Y0)*ph;
  g.lineWidth=1;g.strokeStyle=c('line');g.fillStyle=c('mute');g.font='12px Figtree,sans-serif';g.textAlign='center';
  for(let x=X0;x<=X1;x++){g.beginPath();g.moveTo(X(x),Y(Y0));g.lineTo(X(x),Y(Y1));g.stroke();g.fillText(x,X(x),H-mB+16)}
  g.textAlign='right';for(let y=Y0;y<=Y1;y++){g.beginPath();g.moveTo(X(X0),Y(y));g.lineTo(X(X1),Y(y));g.stroke();g.fillText(y,mL-8,Y(y)+4)}
  g.strokeStyle=c('mute');g.lineWidth=1.6;g.beginPath();g.moveTo(X(X0),Y(Y1));g.lineTo(X(X0),Y(Y0));g.lineTo(X(X1),Y(Y0));g.stroke();
  g.fillStyle=c('ink');g.font='600 13px Figtree,sans-serif';g.textAlign='right';g.fillText('pan  $',W-mR,H-mB-6);g.textAlign='left';g.fillText('jugo  $',mL+6,mT+10);
  ctx.lines.forEach(l=>{if(l.show===false)return;const e=endsIn(l.eq[0],l.eq[1],l.eq[2],X0,X1,Y0,Y1);if(!e)return;g.strokeStyle=c(l.c);g.lineWidth=3.5;g.lineCap='round';g.beginPath();g.moveTo(X(e[0][0]),Y(e[0][1]));g.lineTo(X(e[1][0]),Y(e[1][1]));g.stroke()});
  const dot=(p,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(X(p[0]),Y(p[1]),r,0,7);g.fill()};
  ctx.mark.forEach(p=>{dot(p,6,c('ink'));g.fillStyle=c('ink');g.font='600 13px Figtree,sans-serif';g.textAlign='left';g.fillText(`(${fmt(p[0])}, ${fmt(p[1])})`,X(p[0])+9,Y(p[1])-9)});
  ctx.trace.forEach(p=>dot(p,6,c('ana')));
  if(ctx.pt){const vis=ctx.lines.filter(l=>l.chip),all=vis.length&&vis.every(l=>sat(l.eq,ctx.pt)),some=vis.filter(l=>sat(l.eq,ctx.pt));

  if(ctx.pt){ps.innerHTML=`<span>pan $${fmt(ctx.pt[0])} · jugo $${fmt(ctx.pt[1])}</span>`+ctx.lines.filter(l=>l.chip).map(l=>{const ok=sat(l.eq,ctx.pt),v=l.eq[0]*ctx.pt[0]+l.eq[1]*ctx.pt[1];return `<span class="chip ${ok?'ok':'no'}">${l.name} ${ok?'✓ cuadra':'pagaría $'+fmt(v)}</span>`}).join('')}
  ctx.cv.dataset.pt=ctx.pt?ctx.pt.join(','):''}
 ctx.draw=draw;
 const move=p=>{p=[Math.min(X1,Math.max(X0,Math.round(p[0]*2)/2)),Math.min(Y1,Math.max(Y0,Math.round(p[1]*2)/2))];if(ctx.pt&&p[0]===ctx.pt[0]&&p[1]===ctx.pt[1])return;ctx.pt=p;draw();cfg.on&&cfg.on(ctx)};

  const at=e=>{const r=cv.getBoundingClientRect(),W=r.width,H=r.height;return [X0+((e.clientX-r.left)-mL)/(W-mL-mR)*(X1-X0),Y0+((H-mB-(e.clientY-r.top)))/(H-mB-mT)*(Y1-Y0)]};
  let drag=false;cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';move(at(e))});
  cv.addEventListener('pointermove',e=>{if(drag)move(at(e))});cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
  cv.addEventListener('keydown',e=>{const d={ArrowRight:[.5,0],ArrowLeft:[-.5,0],ArrowUp:[0,.5],ArrowDown:[0,-.5]}[e.key];if(d){e.preventDefault();move([ctx.pt[0]+d[0],ctx.pt[1]+d[1]])}})}
 const ro=new ResizeObserver(draw);ro.observe(cv);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);

]},
{title:'Nivel 2 · Verlo en un plano',steps:[
 explore('plane-move','Cada punto del plano es una pareja de precios. Arrastra el punto hasta pan $5 y jugo $1. También puedes usar las flechas.',(el,api)=>plane(el,api,{start:[1,1],on:c=>{if(c.pt[0]===5&&c.pt[1]===1)api.done()}}),
  {ok:'Pan $5, jugo $1: el punto (5, 1). Primero va el pan, luego el jugo.',hint:'Cuenta 5 hacia la derecha y 1 hacia arriba.'}),
 explore('plane-ana','Arrastra el punto. Cada vez que la boleta de Ana cuadre, deja una marca. Consigue 4 marcas distintas.',(el,api)=>{
  const ctx=plane(el,api,{start:[1,1],lines:[{eq:EA,c:'ana',name:'Ana',chip:true,show:false}],on:c=>{
   if(c.sat(EA,c.pt)&&!c.trace.some(p=>p[0]===c.pt[0]&&p[1]===c.pt[1])){c.trace.push(c.pt.slice());c.draw();
    if(c.trace.length>=4){c.lines[0].show=true;c.draw();api.done()}}}})},
  {ok:'Mira: todas las marcas caen sobre una recta. Esa recta son todas las parejas que cumplen la boleta de Ana.',hint:'Si el pan cuesta 0, el jugo debe costar 6. Si el pan cuesta 2, el jugo cuesta 3. Prueba también el pan en 4.'}),
 fill('ana-int','Dos puntos bastan para dibujar una recta. En 3x + 2y = 12: si el jugo cuesta $0, ¿cuánto cuesta el pan? Y si el pan cuesta $0, ¿cuánto el jugo?','Con jugo $0: pan = $[[4]]<br>Con pan $0: jugo = $[[6]]',
  '3x = 12 da x = 4, y 2y = 12 da y = 6. Los puntos (4, 0) y (0, 6) bastan para trazar la recta.',{hint:'Con jugo $0 queda 3x = 12. Con pan $0 queda 2y = 12.',
  mount:(el)=>plane(el,{},{noPoint:true,lines:[{eq:EA,c:'ana',name:'Ana'}]})}),
 fill('luis-int','Lo mismo con Luis: x + 4y = 14. Si el pan cuesta $0, ¿cuánto cuesta un jugo? Y si el pan cuesta $6, ¿cuánto?','Con pan $0: jugo = $[[3.5]]<br>Con pan $6: jugo = $[[2]]',
  '4y = 14 da y = 3,5. Con pan $6 queda 4y = 8, y = 2. Los puntos (0; 3,5) y (6, 2) trazan la recta de Luis.',{hint:'Con pan $0 queda 4y = 14. Con pan $6 queda 6 + 4y = 14.',
  mount:(el)=>plane(el,{},{noPoint:true,lines:[{eq:EB,c:'luis',name:'Luis'}]})}),
 explore('plane-both','Ahora están las dos rectas. Arrastra el punto hasta donde las dos boletas cuadren.',(el,api)=>plane(el,api,{start:[1,1],lines:[{eq:EA,c:'ana',name:'Ana',chip:true},{eq:EB,c:'luis',name:'Luis',chip:true}],on:c=>{if(c.sat(EA,c.pt)&&c.sat(EB,c.pt))api.done()}}),
  {ok:'Se cruzan en (2, 3). Ese punto está en las dos rectas, así que cumple las dos ecuaciones. La solución es el cruce.',hint:'Busca el lugar donde las dos rectas se encuentran.'}),
 explore('lab-par','Las rectas no siempre se cruzan. Cambia los números de la boleta de Luis hasta que las rectas sean paralelas.',(el,api)=>linesLab(el,api,'paralelas'),
  {ok:'Paralelas: nunca se tocan, así que no hay solución. Pasa cuando dos boletas se contradicen: mismas compras, distinto precio.',hint:'Las rectas deben tener la misma inclinación. Prueba 3 panes y 2 jugos con otro total.'}),
 explore('lab-same','Ahora al revés: haz que sean la misma recta.',(el,api)=>linesLab(el,api,'misma'),
  {ok:'La misma recta: infinitas soluciones. La segunda boleta no aportó nada nuevo, era la primera disfrazada.',hint:'Duplica la boleta de Ana: 6 panes, 4 jugos y $24.'}),
 choice('zero6','Resuelves un sistema y al restar las ecuaciones te queda 0 = 6. ¿Qué significa?',['No tiene solución (rectas paralelas)','Tiene infinitas soluciones','La solución es 6'],0,
  'Cero nunca es igual a seis: las ecuaciones se contradicen. Si hubiera quedado 0 = 0, serían infinitas.',{1:'Infinitas soluciones aparecen con 0 = 0, que es cierto siempre.',2:'No hay ninguna incógnita despejada, solo una igualdad falsa.'}),
 choice('exact','Dibujas las rectas y se cruzan "más o menos" en (2,4; 3,8). ¿Qué haces para estar seguro?',['Compruebo el punto en las dos ecuaciones','Confío en el dibujo','Dibujo las rectas más gruesas'],0,
  'El dibujo da la intuición y el cálculo da la exactitud. Los próximos métodos calculan sin dibujar.',{1:'El ojo no distingue 2,4 de 2,37.',2:'El color no cambia dónde se cruzan.'})
]},
{title:'Nivel 3 · Cambiar una cosa por otra',steps:[
 explore('bill','Un billete de $20 vale lo mismo que dos de $10. Toca el billete.',(el,api)=>{
  el.innerHTML=`<div class="bills" id="bl"><button class="bill" id="b20">$20</button></div>`;
  $('b20').onclick=()=>{$('bl').innerHTML='<span class="bill" style="cursor:default">$10</span><span style="font-size:28px">+</span><span class="bill" style="cursor:default">$10</span>';api.done()}},
  {ok:'Si dos cosas valen lo mismo, puedes cambiar una por otra sin perder nada. La sustitución usa esa idea con las incógnitas.'}),
 choice('which','Quieres dejar una incógnita sola en este sistema. ¿Cuál conviene despejar?',['La x de la segunda ecuación','La y de la primera ecuación','La x de la primera ecuación'],0,
  'En x + 4y = 14 la x no tiene número delante: despejarla solo pide restar 4y. Las otras obligan a dividir y aparecen fracciones.',{1:'Habría que dividir entre 2.',2:'Habría que dividir entre 3.'},{vis:`<div class="card">${SYSC}</div>`}),
 choice('despeje','Para dejar la x sola en x + 4y = 14, ¿qué haces?',['Restar 4y a los dos lados','Dividir los dos lados entre 4','Sumar 4y a los dos lados'],0,
  'Restas 4y de los dos lados y queda x = 14 − 4y. Es una receta: el precio del pan según el precio del jugo.',{1:'Dividir entre 4 no quita 4y de la izquierda.',2:'Sumar 4y lo dejaría aún peor: x + 8y.'}),
 explore('tapx','Cambia la x de la primera ecuación por su receta. Toca la x.',(el,api)=>{
  el.innerHTML=`<div class="eqline" id="e1">3<button class="slot" id="sx" aria-label="x"><i class="v">x</i></button> + 2<i class="v">y</i> = 12</div><div class="eq" style="line-height:1.4">Receta: <span class="tile">${V('{x} = 14 − 4{y}')}</span></div>`;
  $('sx').onclick=()=>{$('e1').innerHTML=V('3<span class="newpart">(14 − 4{y})</span> + 2{y} = 12');api.done()}},
  {ok:'Mira: la x desapareció. Quedó una ecuación con una sola incógnita.'}),
 choice('paren','¿Por qué la receta entra entre paréntesis?',['Porque el 3 multiplica todo el paquete','Porque así queda más ordenado','Porque ahí se suman los términos'],0,
  'La x valía todo 14 − 4y, así que el 3 debe multiplicar a todo el paquete. Sin paréntesis, el cálculo sale mal.',{1:'No es adorno: cambia el resultado.',2:'No se suma nada: se multiplica por 3.'}),
 fill('dist','Reparte el 3 y junta las y. ¿Qué número falta?','3(14 − 4{y}) + 2{y} = 12<br>42 − [[10]]{y} = 12','3 · 14 = 42, y −12y + 2y = −10y.',{hint:'Junta −12y y +2y.'}),
 fill('solvey','Resuelve la y.','42 − 10{y} = 12<br>{y} = [[3]]','Pasas el 42 restando: −10y = −30, así que y = 3. El jugo cuesta $3.',{hint:'42 − 12 = 30. Entonces 10y = 30.'}),
 fill('solvex','Vuelve a la receta x = 14 − 4y con y = 3.','{x} = 14 − 4 · 3 = [[2]]','x = 2: el pan cuesta $2. Es el mismo punto que viste en el cruce del plano.',{hint:'4 por 3 son 12.'}),
 choice('trapsub','Tu amigo sustituye x = 14 − 4y en la misma ecuación de donde la despejó, x + 4y = 14, y obtiene 14 = 14. ¿Qué pasó?',['No aporta nada: hay que sustituir en la otra','Ya resolvió el sistema','Se equivocó al restar'],0,
  'Esa ecuación ya se gastó al despejar. Siempre sustituye en la otra.',{1:'14 = 14 no dice cuánto vale ninguna incógnita.',2:'La resta estaba bien: el problema es dónde sustituyó.'}),
 choice('ig1','Despejemos la x en las dos ecuaciones: x = (12 − 2y)/3 y x = 14 − 4y. Es el mismo pan de la misma panadería. ¿Qué haces?',['Igualar las dos recetas','Sumar las dos recetas','Multiplicar las dos recetas'],0,
  'Si dos expresiones valen lo mismo que x, valen lo mismo entre sí. Esa es la igualación.',{1:'Sumarlas no usa que valen lo mismo.',2:'Multiplicarlas complica todo.'}),
 fill('ig2','(12 − 2y)/3 = 14 − 4y. Multiplica los dos lados por 3.','12 − 2{y} = [[42]] − [[12]]{y}','El 14 también se triplica: 42. Y el 4y se vuelve 12y.',{hint:'Multiplica cada término del lado derecho por 3.'}),
 fill('ig3','Junta las y a un lado y los números al otro.','[[10]]{y} = [[30]]','−2y + 12y = 10y y 42 − 12 = 30, así que y = 3 otra vez.',{hint:'Pasa −12y a la izquierda y 12 a la derecha.'}),
 choice('ig4','¿Qué relación tiene la igualación con la sustitución?',['Es una sustitución con recetas ya despejadas','No tienen relación','Solo sirve con rectas paralelas'],0,
  'Es lo mismo: cambias una receta por otra para quedarte con una sola incógnita.',{1:'En el fondo son la misma idea.',2:'Sirve para cualquier sistema.'})
]},
{title:'Nivel 4 · Sumar verdades',steps:[
 explore('balance','Cada ecuación es una balanza en equilibrio. Multiplica x + 4y = 14 por 3 sin romper el equilibrio.',(el,api)=>balance(el,api),
  {ok:'Hay que multiplicar los dos lados. Si tocas solo uno, la ecuación deja de ser verdad.',hint:'Usa los dos botones: uno por cada lado.'}),
 choice('sumeq','Si A = B y C = D, ¿qué siempre es verdad?',['A + C = B + D','A + C = B − D','A = D'],0,
  'Dos balanzas en equilibrio, juntas, siguen en equilibrio. Por eso podemos sumar o restar ecuaciones enteras.',{1:'Si sumas a un lado, debes sumar lo mismo al otro.',2:'Nada dice que A y D sean iguales.'}),
 choice('mult','En 3x + 2y = 12 y x + 4y = 14, ¿por cuánto multiplicas la segunda para que su x iguale a la de la primera?',['Por 3','Por 2','Por 4'],0,
  'x por 3 es 3x. La segunda queda 3x + 12y = 42.',{1:'Con 2 quedaría 2x.',2:'Con 4 quedaría 4x.'},{vis:`<div class="card">${SYSC}</div>`}),
 choice('sumres','Ahora tienes 3x + 12y = 42 y 3x + 2y = 12. Las x tienen el mismo signo. ¿Qué haces para eliminarlas?',['Restar las ecuaciones','Sumar las ecuaciones'],0,
  '3x − 3x = 0: la x se va.',{1:'Si sumas queda 6x, y no desaparece.'},{vis:`<div class="card"><div class="eqs" style="align-items:center">${g5(3,12,42,'t-luis')}${g5(3,2,12,'t-ana')}</div></div>`}),
 fill('red1','Resta la segunda ecuación de la primera.','(3{x} + 12{y} = 42) − (3{x} + 2{y} = 12)<br>[[10]]{y} = [[30]]','12y − 2y = 10y y 42 − 12 = 30. Cuidado: al restar, el signo cambia en toda la ecuación de abajo.',{hint:'12 − 2 y 42 − 12.'}),
 fill('red2','Ahora termina: halla y, y vuelve a x + 4y = 14 para hallar x.','{y} = [[3]]<br>{x} = [[2]]','y = 30 ÷ 10 = 3. Y x + 12 = 14, así que x = 2. Tercer método, misma pareja.',{hint:'Con y = 3, queda x + 12 = 14.'}),
 choice('opp','En 2x + 3y = 12 y 4x − 3y = 6, ¿qué conviene?',['Sumar','Restar','Dividir'],0,
  'Las y son 3y y −3y: se cancelan al sumar. Queda 6x = 18, así que x = 3.',{1:'Al restar, las y se duplican: 6y.',2:'Dividir no elimina ninguna incógnita.'}),
 read('callback','¿Recuerdas que comparando las boletas dedujiste que el jugo cuesta $1 más que el pan? Eso ya era una reducción: restaste una boleta de otra. Lo descubriste antes de que te lo enseñara.',
  `<div class="card"><div class="eqs" style="align-items:center">${g5(1,4,14,'t-luis')}${g5(3,2,12,'t-ana')}</div></div>`)
]},
{title:'Nivel 5 · Tu turno',steps:[
 choice('pick1','¿Qué método te da menos trabajo con y = 2x − 1 y 3x + y = 9?',['Sustitución','Reducción','Gráfico'],0,
  'La y ya está despejada: la cambias en la segunda y queda 3x + 2x − 1 = 9.',{1:'Se puede, pero primero habría que ordenar.',2:'Daría solo un cruce aproximado.'}),
 choice('pick2','¿Y con x = 5 − y y x = 2y − 1?',['Igualación','Reducción','Gráfico'],0,
  'Las dos despejan x. Igualas: 5 − y = 2y − 1.',{1:'Aquí ya vienen despejadas.',2:'Daría solo un cruce aproximado.'}),
 choice('pick3','¿Y con 2x + 3y = 12 y 4x − 3y = 6?',['Reducción','Igualación','Sustitución'],0,
  'Las y son 3y y −3y: sumas y desaparecen.',{1:'Habría que despejar con fracciones.',2:'Habría que despejar con fracciones.'}),
 check('ch1','Reto 1 de 3. Resuelve con el método que quieras. Si te atascas, pide ayuda abajo.',(el,api)=>challenge(el,api,0)),
 check('ch2','Reto 2 de 3.',(el,api)=>challenge(el,api,1)),
 check('ch3','Reto 3 de 3. Este tiene números más difíciles.',(el,api)=>challenge(el,api,2)),
 read('fin','Lo descubriste tú: una ecuación es una verdad, y resolver un sistema es combinar verdades hasta tener una con una sola incógnita.',
  `<div class="idea">combinar verdades</div><div class="pills"><span class="pill">Gráfico: ver el cruce</span><span class="pill">Sustitución: cambiar por su equivalente</span><span class="pill">Igualación: dos recetas del mismo valor</span><span class="pill">Reducción: sumar balanzas</span></div>`,{last:true})
]}
];

/* ===== motor de la lección ===== */
const flat=[];LV.forEach((lv,li)=>lv.steps.forEach((st,si)=>flat.push({li,si,st})));
let gi=0,S=null,SEL=null;
const store={get(){try{return +localStorage.getItem('sel-prog')||0}catch(e){return 0}},set(v){try{localStorage.setItem('sel-prog',v)}catch(e){}}};
function buildProg(){$('prog').innerHTML=LV.map(()=>'<div class="seg"><i></i></div>').join('')}
function updProg(){const e=flat[gi];[...$('prog').children].forEach((s,i)=>{const n=LV[i].steps.length;s.firstChild.style.width=(i<e.li?100:i===e.li?(e.si/n*100):0)+'%'});$('prog').setAttribute('aria-valuenow',Math.round(gi/flat.length*100))}
function setBtn(label,enabled){const b=$('go');b.textContent=label;b.disabled=!enabled}
function show(i){
 gi=i;store.set(i);const e=flat[i],st=e.st;SEL=null;
 S={phase:'ask',en:false,check:null,onRetry:null};
 $('ft').className='';$('sheet').hidden=true;$('lvl').textContent=LV[e.li].title;
 $('prompt').innerHTML=V(st.text);const vis=$('vis');vis.innerHTML='';vis.dataset.sid=st.id;vis.dataset.kind=st.k;
 vis.className='enter';void vis.offsetWidth;
 const api={enable:v=>{S.en=v;if(S.phase==='ask'&&S.check)setBtn('Comprobar',v)},setCheck:f=>{S.check=f},
  done:msg=>{if(S.phase!=='ask')return;succeed(msg||st.ok||st.why||'¡Muy bien!')}};
 if(st.vis)vis.insertAdjacentHTML('beforeend',st.vis);
 if(st.k==='read'){S.phase='ok';setBtn(st.last?'Terminar':'Continuar',true)}
 else if(st.k==='choice')mountChoice(st,vis,api);
 else if(st.k==='fill'){const d=document.createElement('div');d.className='eq';d.innerHTML=blanksHTML(st.eq);vis.appendChild(d);if(st.mount)st.mount(vis,{});wireBlanks(vis,api,st.why);setBtn('Comprobar',false)}
 else if(st.k==='explore'){setBtn('Continuar',false);st.mount(vis,api)}
 else if(st.k==='check'){setBtn('Comprobar',false);st.mount(vis,api)}
 if(st.hint)addHint(vis,st.hint);
 updProg();$('main').scrollTop=0;say(st.text)}
function addHint(vis,txt){const b=document.createElement('button');b.className='hintbtn';b.textContent='¿Una pista?';const box=document.createElement('div');box.className='hintbox';box.hidden=true;box.innerHTML=V(txt);
 b.onclick=()=>{box.hidden=!box.hidden;if(!box.hidden)say(txt)};vis.appendChild(b);vis.appendChild(box)}
function mountChoice(st,vis,api){
 const idx=st.opts.map((_,i)=>i);if(!st.keep)for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:10px';
 idx.forEach((oi,n)=>{const b=document.createElement('button');b.className='opt';b.dataset.i=oi;b.innerHTML=`<span class="k">${'ABCD'[n]}</span><span>${V(st.opts[oi])}</span>`;
  b.onclick=()=>{if(S.phase!=='ask'||b.classList.contains('wrong'))return;box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');SEL=oi;api.enable(true)};box.appendChild(b)});
 vis.appendChild(box);
 api.setCheck(()=>SEL===st.ans?{ok:true,msg:st.why}:{ok:false,msg:st.hints[SEL]||'Casi. Piénsalo otra vez.'});
 S.onRetry=()=>{const b=box.querySelector(`.opt[data-i="${SEL}"]`);if(b){b.classList.remove('sel');b.classList.add('wrong')}SEL=null;api.enable(false)};
 S.markRight=()=>{const b=box.querySelector(`.opt[data-i="${SEL}"]`);if(b){b.classList.remove('sel');b.classList.add('right')}};
 setBtn('Comprobar',false)}
function sheet(kind,title,msg){const s=$('sheet');s.hidden=false;s.innerHTML=`<h3>${title}</h3><p>${V(msg)}</p>`;$('ft').className=kind}
const GOOD=['¡Eso es!','¡Muy bien!','Exacto.','Así se hace.'];
function succeed(msg){S.phase='ok';if(S.markRight)S.markRight();sheet('ok',GOOD[Math.floor(Math.random()*GOOD.length)],msg);setBtn(flat[gi].st.last?'Terminar':'Continuar',true);say(msg);
 document.querySelectorAll('#vis input.blank').forEach(i=>i.disabled=true)}
function fail(msg){S.phase='bad';sheet('bad','Todavía no',msg);setBtn('Intentar de nuevo',true);say(msg)}
function retry(){S.phase='ask';$('ft').className='';$('sheet').hidden=true;if(S.onRetry)S.onRetry();setBtn('Comprobar',S.en&&S.check?S.en:false);if(S.en)$('go').disabled=false;const f=document.querySelector('#vis input.blank.bad');if(f)f.focus()}
$('go').onclick=()=>{
 const st=flat[gi].st;
 if(S.phase==='ok'){if(st.last){SS&&SS.cancel();$('start').hidden=false;store.set(0);$('goC').hidden=true;return}next();return}
 if(S.phase==='bad'){retry();return}
 if(S.check){const r=S.check();r.ok?succeed(r.msg):fail(r.msg)}};
function next(){if(gi<flat.length-1)show(gi+1)}
$('say').onclick=()=>say(flat[gi].st.text);
$('snd').onclick=()=>{SND=!SND;$('snd').textContent=SND?'🔊':'🔇';if(!SND&&SS)SS.cancel()};
$('menu').onclick=()=>{$('menuP').hidden=false};
$('menuP').onclick=e=>{if(e.target===$('menuP'))$('menuP').hidden=true};
function buildMenu(){let k=0;$('menuL').innerHTML='';LV.forEach((lv,li)=>{const start=k;k+=lv.steps.length;const b=document.createElement('button');b.className='lv';b.innerHTML=`${lv.title}<small>${lv.steps.length} pantallas</small>`;b.onclick=()=>{$('menuP').hidden=true;show(start)};$('menuL').appendChild(b)})}
addEventListener('keydown',e=>{if(e.key==='Escape')$('menuP').hidden=true});
function begin(i){if(SS){const u=new SpeechSynthesisUtterance(' ');SS.speak(u)}$('start').hidden=true;buildProg();buildMenu();show(i)}
$('go0').onclick=()=>begin(0);
$('goC').onclick=()=>begin(Math.min(store.get(),flat.length-1));
{const p=store.get();if(p>0&&p<flat.length-1)$('goC').hidden=false}
const qs=new URLSearchParams(location.search);if(qs.get('step'))begin(+qs.get('step'));
</script>
</body>
